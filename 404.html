<!doctype html>
<html lang="tr" data-native="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sayfa yok · fadimrak</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/assets/site.js?v=6"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #0a0a0a; color: #cfcfcf; font-family: ui-monospace, Menlo, Consolas, monospace; padding: 16px; box-sizing: border-box; }
  html[data-theme=light] { filter: invert(1); }
  main { width: min(520px, 100%); }
  .code { font-size: clamp(4rem, 22vw, 7rem); line-height: 1; color: #e6e6e6; letter-spacing: .05em; }
  .code span { display: inline-block; animation: wob 2.4s ease-in-out infinite; }
  .code span:nth-child(2) { animation-delay: -.8s; } .code span:nth-child(3) { animation-delay: -1.6s; }
  @keyframes wob { 50% { transform: translateY(-6px); } }
  p { color: #888; line-height: 1.6; margin: .6rem 0; }
  code { color: #e6e6e6; overflow-wrap: anywhere; }
  input { width: 100%; box-sizing: border-box; margin-top: 1rem; padding: .75rem .9rem; background: #111; border: 1px solid #2a2a2a; border-radius: 10px; color: #e6e6e6; font: inherit; outline: none; }
  input:focus { border-color: #555; }
  ul { list-style: none; padding: 0; margin: .6rem 0 0; }
  li a { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem .2rem; border-bottom: 1px solid #1a1a1a; color: #cfcfcf; text-decoration: none; }
  li a:hover, li a:focus-visible { color: #fff; outline: none; background: #111; }
  li small { color: #666; }
  .links { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-top: 1.4rem; }
  .links a { color: #888; } .links a:hover { color: #e6e6e6; }
  .bye { font-size: .8rem; color: #555; }
  @media (prefers-reduced-motion: reduce) { .code span { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
  <p><code id="path"></code> diye bir sayfa yok.</p>
  <div id="sug"></div>
  <input id="q" type="search" placeholder="aradığın neydi?" aria-label="sitede ara" autocomplete="off">
  <ul id="res"></ul>
  <div class="links"><a href="/">ana sayfa</a><a href="/yks/">YKS</a><a href="/araclar/">araçlar</a><a href="/games/">oyunlar</a></div>
  <p class="bye" id="bye"></p>
  <footer class="bye">fadimrak tarafından yapılmıştır · <a href="/telif/" style="color:inherit">telif hakları</a></footer>
</main>
<script>
const path = decodeURIComponent(location.pathname);
site.$('#path').textContent = path;
const find = q => {
  const words = site.norm(q).split(/[\s/\-_.]+/).filter(w => w.length > 1);
  if (!words.length) return [];
  return site.index.map(e => [e, words.filter(w => site.norm(e[0] + ' ' + e[2] + ' ' + e[3] + ' ' + e[1]).includes(w)).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
};
const list = (el, items) => el.innerHTML = items.map(e => `<li><a href="${e[1]}">${site.esc(e[0])}<small>${site.esc(e[2])}</small></a></li>`).join('');
const sug = find(path);
if (sug.length) { site.$('#sug').innerHTML = '<p>Belki bunlardan biri:</p><ul id="s1"></ul>'; list(site.$('#s1'), sug); }
site.$('#q').oninput = () => { stop(); list(site.$('#res'), find(site.$('#q').value)); };
site.$('#q').onkeydown = e => { const a = site.$('#res a'); if (e.key === 'Enter' && a) location.href = a.href; };
// Bir şeye dokunulmazsa 15 saniye sonra ana sayfaya dön
let n = 15, t = setInterval(() => { n--; site.$('#bye').textContent = `${n} saniye sonra ana sayfaya dönülecek.`; if (!n) location.replace('/'); }, 1000);
const stop = () => { clearInterval(t); site.$('#bye').textContent = ''; };
site.$('#bye').textContent = `${n} saniye sonra ana sayfaya dönülecek.`;
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, stop, { once: true }));
</script>
</body>
</html>
