  era = era === b.dataset.e ? null : b.dataset.e;
  site.$$('#eras .chip').forEach(x => { x.classList.toggle('on', x.dataset.e === era); x.setAttribute('aria-pressed', x.dataset.e === era); });
  render();
};
function render() {
  const q = site.norm(site.$('#q').value.trim());
  let last = '';
  site.$('#tl').innerHTML = EV.filter(e => (!era || e[4] === era) && (!q || site.norm(e[1] + ' ' + e[2] + ' ' + e[3]).includes(q))).map(e => {

    return `<li class="${same ? 'hide-y' : ''}" style="--c:${ERAS[e[4]][1]}"><span class="y">${y}</span><span class="dot"></span><div class="t"><b>${site.esc(e[2])}</b>${sub ? `<small>${sub}</small>` : ''}</div></li>`;
