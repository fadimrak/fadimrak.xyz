<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>periyodik tablo · YKS · fadimrak</title>
<meta name="description" content="Tıklanabilir periyodik tablo: Türkçe adlar, atom kütlesi, elektron dizilimi, elektronegatiflik">
<meta name="theme-color" content="#f6f0e4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=6">
<script src="/assets/site.js?v=6"></script>
<style>
  :root { --accent: var(--purple);
    --c-a: #ff8a7a; --c-t: #ffc56b; --c-g: #ffe08a; --c-l: #f7b4d8; --c-k: #e6a7f0; --c-z: #b9d6a3; --c-y: #8fd6c9; --c-m: #9cc7ff; --c-h: #8fe0ff; --c-s: #c9b6ff; }
  .pt-wrap { overflow-x: auto; padding: 4px 4px 8px; }
  .pt { display: grid; grid-template-columns: repeat(18, minmax(44px, 1fr)); gap: 3px; min-width: 820px; }
  .el { position: relative; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 7px; background: var(--c); color: #1c1a17; padding: 2px 4px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; font: inherit; text-align: left; min-height: 0; box-shadow: none; transition: transform .12s, opacity .2s; }
  .el:hover:not(:disabled) { transform: scale(1.12); z-index: 2; box-shadow: 2px 2px 0 var(--sh); }
  .el small { font-size: .62rem; font-weight: 600; line-height: 1; }
  .el b { font-size: 1.05rem; line-height: 1; font-weight: 800; }
  .el.dim { opacity: .2; }
  .el.on { outline: 3px solid var(--ink); outline-offset: 1px; }
  .gap { aspect-ratio: 1; display: grid; place-items: center; font-size: .62rem; color: var(--muted); text-align: center; }
  .frow { margin-top: 10px; }
  .gh { font-size: .62rem; text-align: center; color: var(--muted); font-weight: 700; align-self: end; }
  .legend { display: flex; gap: .35rem; flex-wrap: wrap; margin: .8rem 0; }
  .legend button { min-height: 32px; padding: .2rem .6rem; font-size: .78rem; border-radius: 99px; box-shadow: none; background: var(--c); color: #1c1a17; }
  .legend button[aria-pressed=true] { outline: 3px solid var(--ink); }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start; }
  .big-el { width: 110px; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 14px; background: var(--c); color: #1c1a17; display: flex; flex-direction: column; justify-content: space-between; padding: .5rem .6rem; box-shadow: var(--shadow); }
  .big-el b { font-size: 2.4rem; font-weight: 900; line-height: 1; }
  .info dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem .9rem; margin: 0; font-size: .92rem; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; font-weight: 600; }
  .mode { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  @media (max-width: 520px) { .info { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="wide"><a class="back" href="/yks/">← YKS</a><h1>periyodik tablo</h1><div class="acts"></div></header>
<main class="wide">
  <div class="mode"><button class="chip on" data-m="cat">gruplara göre</button><button class="chip" data-m="en">elektronegatiflik</button><button class="chip" data-m="state">oda sıcaklığında hal</button><input id="q" type="search" placeholder="element ara (ad, sembol, numara)" aria-label="element ara" style="flex:1 1 200px"></div>
  <div class="legend" id="legend"></div>
  <div class="pt-wrap"><div class="pt" id="pt"></div><div class="pt frow" id="pf"></div></div>
  <div class="panel info" id="info" aria-live="polite"></div>
  <p class="muted small">Atom kütleleri IUPAC standart değerlerine göre yuvarlanmıştır; köşeli parantezdeki değerler en kararlı izotopun kütle numarasıdır. Elektronegatiflik Pauling ölçeğindedir. Tabloyu yatay kaydırabilirsin.</p>
</main>
<script>
// Z|sembol|ad|kütle|kategori|elektronegatiflik
const RAW = `H|Hidrojen|1,008|m|2,20 He|Helyum|4,0026|s| Li|Lityum|6,94|a|0,98 Be|Berilyum|9,0122|t|1,57 B|Bor|10,81|y|2,04 C|Karbon|12,011|m|2,55 N|Azot|14,007|m|3,04 O|Oksijen|15,999|m|3,44 F|Flor|18,998|h|3,98 Ne|Neon|20,180|s|
Na|Sodyum|22,990|a|0,93 Mg|Magnezyum|24,305|t|1,31 Al|Alüminyum|26,982|z|1,61 Si|Silisyum|28,085|y|1,90 P|Fosfor|30,974|m|2,19 S|Kükürt|32,06|m|2,58 Cl|Klor|35,45|h|3,16 Ar|Argon|39,948|s|
K|Potasyum|39,098|a|0,82 Ca|Kalsiyum|40,078|t|1,00 Sc|Skandiyum|44,956|g|1,36 Ti|Titanyum|47,867|g|1,54 V|Vanadyum|50,942|g|1,63 Cr|Krom|51,996|g|1,66 Mn|Mangan|54,938|g|1,55 Fe|Demir|55,845|g|1,83 Co|Kobalt|58,933|g|1,88 Ni|Nikel|58,693|g|1,91 Cu|Bakır|63,546|g|1,90 Zn|Çinko|65,38|g|1,65 Ga|Galyum|69,723|z|1,81 Ge|Germanyum|72,630|y|2,01 As|Arsenik|74,922|y|2,18 Se|Selenyum|78,971|m|2,55 Br|Brom|79,904|h|2,96 Kr|Kripton|83,798|s|3,00
Rb|Rubidyum|85,468|a|0,82 Sr|Stronsiyum|87,62|t|0,95 Y|İtriyum|88,906|g|1,22 Zr|Zirkonyum|91,224|g|1,33 Nb|Niyobyum|92,906|g|1,6 Mo|Molibden|95,95|g|2,16 Tc|Teknesyum|[98]|g|1,9 Ru|Rutenyum|101,07|g|2,2 Rh|Rodyum|102,91|g|2,28 Pd|Paladyum|106,42|g|2,20 Ag|Gümüş|107,87|g|1,93 Cd|Kadmiyum|112,41|g|1,69 In|İndiyum|114,82|z|1,78 Sn|Kalay|118,71|z|1,96 Sb|Antimon|121,76|y|2,05 Te|Tellür|127,60|y|2,1 I|İyot|126,90|h|2,66 Xe|Ksenon|131,29|s|2,6
Cs|Sezyum|132,91|a|0,79 Ba|Baryum|137,33|t|0,89 La|Lantan|138,91|l|1,10 Ce|Seryum|140,12|l|1,12 Pr|Praseodim|140,91|l|1,13 Nd|Neodim|144,24|l|1,14 Pm|Prometyum|[145]|l| Sm|Samaryum|150,36|l|1,17 Eu|Evropiyum|151,96|l| Gd|Gadolinyum|157,25|l|1,20 Tb|Terbiyum|158,93|l| Dy|Disprozyum|162,50|l|1,22 Ho|Holmiyum|164,93|l|1,23 Er|Erbiyum|167,26|l|1,24 Tm|Tulyum|168,93|l|1,25 Yb|İterbiyum|173,05|l| Lu|Lutesyum|174,97|l|1,27
Hf|Hafniyum|178,49|g|1,3 Ta|Tantal|180,95|g|1,5 W|Tungsten|183,84|g|2,36 Re|Renyum|186,21|g|1,9 Os|Osmiyum|190,23|g|2,2 Ir|İridyum|192,22|g|2,20 Pt|Platin|195,08|g|2,28 Au|Altın|196,97|g|2,54 Hg|Cıva|200,59|g|2,00 Tl|Talyum|204,38|z|1,62 Pb|Kurşun|207,2|z| Bi|Bizmut|208,98|z|2,02 Po|Polonyum|[209]|y|2,0 At|Astatin|[210]|h|2,2 Rn|Radon|[222]|s|
Fr|Fransiyum|[223]|a|0,7 Ra|Radyum|[226]|t|0,9 Ac|Aktinyum|[227]|k|1,1 Th|Toryum|232,04|k|1,3 Pa|Protaktinyum|231,04|k|1,5 U|Uranyum|238,03|k|1,38 Np|Neptünyum|[237]|k|1,36 Pu|Plütonyum|[244]|k|1,28 Am|Amerikyum|[243]|k| Cm|Küriyum|[247]|k| Bk|Berkelyum|[247]|k| Cf|Kaliforniyum|[251]|k| Es|Aynştaynyum|[252]|k| Fm|Fermiyum|[257]|k| Md|Mendelevyum|[258]|k| No|Nobelyum|[259]|k| Lr|Lavrensiyum|[266]|k|
Rf|Rutherfordiyum|[267]|g| Db|Dubniyum|[268]|g| Sg|Seaborgiyum|[269]|g| Bh|Bohriyum|[270]|g| Hs|Hassiyum|[269]|g| Mt|Meitneriyum|[278]|g| Ds|Darmstadtiyum|[281]|g| Rg|Röntgenyum|[282]|g| Cn|Kopernikyum|[285]|g| Nh|Nihonyum|[286]|z| Fl|Flerovyum|[289]|z| Mc|Moskovyum|[290]|z| Lv|Livermoryum|[293]|z| Ts|Tenesin|[294]|h| Og|Oganesson|[294]|s|`;
const CATS = { a: 'alkali metal', t: 'toprak alkali metal', g: 'geçiş metali', l: 'lantanit', k: 'aktinit', z: 'zayıf metal', y: 'yarı metal', m: 'ametal', h: 'halojen', s: 'soy gaz' };
const GAS = ['H', 'He', 'N', 'O', 'F', 'Ne', 'Cl', 'Ar', 'Kr', 'Xe', 'Rn'], LIQ = ['Br', 'Hg'];
const E = RAW.split(/\s+(?=[A-Z][a-z]?\|)/).map((s, i) => { const [sym, ad, m, c, en] = s.trim().split('|'); return { z: i + 1, sym, ad, m, c, en: en ? parseFloat(en.replace(',', '.')) : null }; });

// Konum: periyot ve grup
const ENDS = [2, 10, 18, 36, 54, 86, 118];
E.forEach(e => {
  const z = e.z, p = ENDS.findIndex(x => z <= x) + 1, first = (ENDS[p - 2] || 0) + 1, i = z - first;
  e.p = p;
  if (p === 1) e.g = z === 1 ? 1 : 18;
  else if (p <= 3) e.g = i < 2 ? i + 1 : i + 11;
  else if (p <= 5) e.g = i + 1;
  else if (i < 2) e.g = i + 1;
  else if (i < 17) e.g = null, e.f = i - 2; // lantanit / aktinit satırı
  else e.g = i - 14;
  e.state = z > 103 ? 'bilinmiyor' : GAS.includes(e.sym) ? 'gaz' : LIQ.includes(e.sym) ? 'sıvı' : 'katı';
});
const gName = g => g == null ? '3B (f bloğu)' : (g <= 2 ? g + 'A' : g <= 7 ? g + 'B' : g <= 10 ? '8B' : g <= 12 ? (g - 10) + 'B' : (g - 10) + 'A') + ` (${g}. grup)`;

// Elektron dizilimi: Aufbau sırası ve bilinen istisnalar
const ORDER = ['1s', '2s', '2p', '3s', '3p', '4s', '3d', '4p', '5s', '4d', '5p', '6s', '4f', '5d', '6p', '7s', '5f', '6d', '7p'];
const CAP = { s: 2, p: 6, d: 10, f: 14 };
const EXC = { 24: '3d5 4s1', 29: '3d10 4s1', 41: '4d4 5s1', 42: '4d5 5s1', 44: '4d7 5s1', 45: '4d8 5s1', 46: '4d10', 47: '4d10 5s1', 57: '5d1 6s2', 58: '4f1 5d1 6s2', 64: '4f7 5d1 6s2', 78: '4f14 5d9 6s1', 79: '4f14 5d10 6s1', 89: '6d1 7s2', 90: '6d2 7s2', 91: '5f2 6d1 7s2', 92: '5f3 6d1 7s2', 93: '5f4 6d1 7s2', 96: '5f7 6d1 7s2' };
const NOBLE = [[86, 'Rn'], [54, 'Xe'], [36, 'Kr'], [18, 'Ar'], [10, 'Ne'], [2, 'He']];
function config(z) {
  const core = NOBLE.find(([n]) => n < z);
  if (EXC[z]) return `[${core[1]}] ${EXC[z]}`.replace(/(\d)([spdf])(\d+)/g, '$1$2<sup>$3</sup>');
  let left = z; const parts = [];
  for (const o of ORDER) { if (!left) break; const n = Math.min(left, CAP[o[1]]); parts.push([o, n]); left -= n; }
  let skip = core ? core[0] : 0;
  const out = parts.filter(([o, n]) => { if (skip >= n) { skip -= n; return false; } return true; });
  return (core ? `[${core[1]}] ` : '') + out.map(([o, n]) => `${o}<sup>${n}</sup>`).join(' ');
}

let mode = 'cat', sel = null, catOn = null;
const enColor = en => en == null ? 'var(--soft)' : `hsl(${220 - (en - .7) / 3.3 * 220} 85% 72%)`;
const fill = e => mode === 'en' ? enColor(e.en) : mode === 'state' ? ({ gaz: '#9cc7ff', sıvı: '#8fe0c0', katı: '#ffd9a0', bilinmiyor: 'var(--soft)' })[e.state] : `var(--c-${e.c})`;
const cell = (e, pos) => `<button class="el" data-z="${e.z}" style="${pos};--c:${fill(e)}" aria-label="${e.ad}, ${e.z}"><small>${e.z}</small><b>${e.sym}</b></button>`;

function draw() {
  let h = '';
  for (let g = 1; g <= 18; g++) h += `<div class="gh" style="grid-row:1;grid-column:${g}">${g}</div>`;
  E.filter(e => e.g).forEach(e => h += cell(e, `grid-row:${e.p + 1};grid-column:${e.g}`));
  h += `<div class="gap" style="grid-row:7;grid-column:3">57-71</div><div class="gap" style="grid-row:8;grid-column:3">89-103</div>`;
  site.$('#pt').innerHTML = h;
  site.$('#pf').innerHTML = E.filter(e => e.f != null).map(e => cell(e, `grid-row:${e.p - 5};grid-column:${e.f + 3}`)).join('');
  site.$('#legend').innerHTML = mode === 'cat' ? Object.entries(CATS).map(([k, v]) => `<button style="--c:var(--c-${k})" data-cat="${k}" aria-pressed="${catOn === k}">${v}</button>`).join('')
    : mode === 'en' ? '<span class="muted small">mavi: düşük · kırmızı: yüksek elektronegatiflik · gri: veri yok (soy gazlar ve bazı ağır elementler)</span>'
    : '<span class="chip" style="background:#9cc7ff;color:#1c1a17">gaz</span> <span class="chip" style="background:#8fe0c0;color:#1c1a17">sıvı</span> <span class="chip" style="background:#ffd9a0;color:#1c1a17">katı</span>';
  filter();
}
function filter() {
  const q = site.norm(site.$('#q').value.trim());
  site.$$('.el').forEach(b => {
    const e = E[b.dataset.z - 1];
    const hit = (!q || site.norm(e.ad).includes(q) || e.sym.toLowerCase() === q || String(e.z) === q) && (!catOn || mode !== 'cat' || e.c === catOn);
    b.classList.toggle('dim', !hit);
    b.classList.toggle('on', sel === e.z);
  });
}
function info(z) {
  sel = z; const e = E[z - 1];
  const block = e.f != null ? 'f' : e.g <= 2 || e.z === 2 ? 's' : e.g >= 13 ? 'p' : 'd';
  site.$('#info').innerHTML = `<div class="big-el" style="--c:var(--c-${e.c})"><small>${e.z}</small><b>${e.sym}</b><small>${e.m}</small></div>
    <div><h2 style="margin:0 0 .5rem">${e.ad}</h2><dl>
      <dt>atom numarası</dt><dd>${e.z}</dd><dt>atom kütlesi</dt><dd>${e.m} g/mol</dd><dt>sınıf</dt><dd>${CATS[e.c]}</dd>
      <dt>periyot / grup</dt><dd>${e.p}. periyot · ${gName(e.g)}</dd><dt>blok</dt><dd>${block}</dd>
      <dt>elektron dizilimi</dt><dd>${config(z)}</dd><dt>elektronegatiflik</dt><dd>${e.en != null ? site.fmt(e.en) : '—'}</dd><dt>oda sıcaklığında</dt><dd>${e.state}</dd>
    </dl></div>`;
  filter();
}
document.addEventListener('click', e => {
  const b = e.target.closest('.el'); if (b) return info(+b.dataset.z);
  const m = e.target.closest('[data-m]'); if (m) { mode = m.dataset.m; site.$$('[data-m]').forEach(x => x.classList.toggle('on', x === m)); draw(); return; }
  const c = e.target.closest('[data-cat]'); if (c) { catOn = catOn === c.dataset.cat ? null : c.dataset.cat; draw(); }
});
site.$('#q').oninput = () => { filter(); const q = site.norm(site.$('#q').value.trim()); const hit = q && E.find(e => site.norm(e.ad) === q || e.sym.toLowerCase() === q || String(e.z) === q); if (hit) info(hit.z); };
draw(); info(6);
</script>
</body>
</html>
