<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bilgi kartları · fadimrak</title>
<meta name="description" content="Kendi bilgi kartlarını (flashcard) oluştur, aralıklı tekrarla çalış">
<meta name="theme-color" content="#f6f0e4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=6">
<script src="/assets/site.js?v=6"></script>
<style>
  :root { --accent: var(--blue); }
  .decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; margin-top: 1rem; }
  .deck { display: grid; gap: .4rem; }
  .deck b { font-size: 1.1rem; }
  .deck small { color: var(--muted); }
  .flip { perspective: 1200px; margin: 1rem auto; width: min(560px, 100%); aspect-ratio: 3 / 2; cursor: pointer; }
  .flip .in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .flip.on .in { transform: rotateY(180deg); }
  .flip .face { position: absolute; inset: 0; backface-visibility: hidden; display: grid; place-items: center; text-align: center; padding: 1.5rem; border: 2px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 600; overflow: auto; white-space: pre-wrap; }
  .flip .back { transform: rotateY(180deg); background: color-mix(in srgb, var(--blue) 14%, var(--card)); }
  .flip .face small { position: absolute; top: .7rem; left: 1rem; font-size: .75rem; color: var(--muted); font-weight: 700; }
  .cards { display: grid; gap: .45rem; margin-top: 1rem; }
  .cards .c { display: grid; grid-template-columns: 1fr 1fr auto; gap: .6rem; align-items: center; padding: .55rem .7rem; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-size: .92rem; }
  .cards .c span { overflow-wrap: anywhere; }
  .box { font-size: .7rem; font-weight: 800; padding: .1rem .45rem; border-radius: 99px; background: var(--soft); }
  .pbar { margin: .5rem 0; }
  @media (max-width: 560px) { .cards .c { grid-template-columns: 1fr auto; } .cards .c span:nth-child(2) { grid-column: 1; color: var(--muted); } }
</style>
</head>
<body>
<header class="wide"><a class="back" href="/araclar/">← araçlar</a><h1>bilgi kartları</h1><div class="acts"></div></header>
<main id="app"></main>
<script>
// Leitner kutuları: bildiğin kart bir üst kutuya çıkar, bilemediğin ilk kutuya döner
const GAP = [0, 1, 3, 7, 14, 30];
let S = store.get('kartlar', { decks: [] }), view = { name: 'list' };
const save = () => store.set('kartlar', S);
const today = () => new Date().toLocaleDateString('sv');
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv'); };
const due = d => d.cards.filter(c => (c.sonraki || '') <= today());
const deck = () => S.decks.find(d => d.id === view.id);
const app = site.$('#app'), E = site.esc;

function render() {
  if (view.name === 'list') {
    app.innerHTML = `<div class="panel"><div class="row l"><input id="nd" placeholder="yeni deste adı (ör. AYT Edebiyat yazar-eser)" style="flex:1 1 220px" aria-label="yeni deste adı"><button class="primary" id="add">deste ekle</button></div></div>
      <div class="decks">${S.decks.map(d => `<div class="panel deck"><b>${E(d.ad)}</b><small>${d.cards.length} kart · bugün ${due(d).length} tekrar</small><div class="row l"><button class="sm primary" data-study="${d.id}" ${d.cards.length ? '' : 'disabled'}>çalış</button><button class="sm" data-open="${d.id}">düzenle</button></div></div>`).join('')}</div>
      ${S.decks.length ? '' : '<p class="hint" style="margin-top:2rem">Henüz deste yok. Bir ad yazıp deste ekle, sonra kartlarını gir.</p>'}`;
  } else if (view.name === 'edit') {
    const d = deck();
    app.innerHTML = `<div class="panel"><div class="row l"><button class="sm" data-back>← desteler</button><input id="rn" value="${E(d.ad)}" aria-label="deste adı" style="flex:1 1 200px"><button class="sm ghost" id="del">desteyi sil</button></div>
      <div class="cols" style="margin-top:1rem"><label class="f">ön yüz<textarea id="fr" style="min-height:5rem" placeholder="soru, kavram, sözcük"></textarea></label><label class="f">arka yüz<textarea id="bk" style="min-height:5rem" placeholder="cevap, açıklama"></textarea></label></div>
      <div class="row l" style="margin-top:.6rem"><button class="primary" id="addc">kart ekle</button><button data-study="${d.id}" ${d.cards.length ? '' : 'disabled'}>çalış</button></div>
      <details style="margin-top:1rem"><summary>toplu ekle</summary><p class="muted small">Her satıra bir kart: <code>ön ; arka</code></p><textarea id="bulk" placeholder="Tanzimat ; 1839\nIslahat ; 1856"></textarea><button class="sm" id="addb" style="margin-top:.5rem">hepsini ekle</button></details></div>
      <div class="cards">${d.cards.map(c => `<div class="c"><span>${E(c.on)}</span><span>${E(c.arka)}</span><div class="row"><span class="box">kutu ${c.kutu + 1}</span><button class="sm ghost" data-delc="${c.id}" aria-label="kartı sil">sil</button></div></div>`).join('')}</div>`;
  } else {
    const d = deck(), q = view.queue, c = q[0];
    if (!c) { app.innerHTML = `<div class="panel" style="text-align:center"><h2>bitti</h2><p>${view.ok} bildin, ${view.bad} tekrar edeceksin.</p><div class="row"><button data-again>kalanları baştan</button><button class="primary" data-back>desteler</button></div></div>`; return; }
    app.innerHTML = `<div class="row l"><button class="sm" data-back>← desteler</button><b style="flex:1">${E(d.ad)}</b><span class="muted small">${view.total - q.length + 1} / ${view.total}</span></div>
      <div class="bar pbar"><i style="width:${(view.total - q.length) / view.total * 100}%"></i></div>
      <div class="flip" id="card" tabindex="0" role="button" aria-label="kartı çevir"><div class="in"><div class="face"><small>ön</small>${E(c.on)}</div><div class="face back"><small>arka</small>${E(c.arka)}</div></div></div>
      <div class="row"><button id="no">bilemedim <kbd>1</kbd></button><button class="primary" id="yes">bildim <kbd>2</kbd></button></div>
      <p class="hint small">Karta dokun ya da <kbd>boşluk</kbd> ile çevir.</p>`;
  }
}
function study(id, all) {
  view = { name: 'study', id };
  const d = deck(), list = all || !due(d).length ? d.cards : due(d);
  view.queue = shuffle(list.slice()); view.total = view.queue.length; view.ok = 0; view.bad = 0;
  render();
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function answer(ok) {
  const c = view.queue.shift();
  c.kutu = ok ? Math.min(GAP.length - 1, c.kutu + 1) : 0;
  c.sonraki = addDays(GAP[c.kutu]);
  ok ? view.ok++ : (view.bad++, view.queue.push(c));
  save(); render();
}

app.onclick = e => {
  const t = e.target;
  if (t.id === 'add') { const ad = site.$('#nd').value.trim(); if (!ad) return; S.decks.push({ id: Date.now(), ad, cards: [] }); save(); render(); return; }
  if (t.closest('[data-open]')) { view = { name: 'edit', id: +t.closest('[data-open]').dataset.open }; render(); return; }
  if (t.closest('[data-study]')) return study(+t.closest('[data-study]').dataset.study);
  if (t.closest('[data-back]')) { view = { name: 'list' }; render(); return; }
  if (t.closest('[data-again]')) return study(view.id, true);
  if (t.id === 'addc') { const on = site.$('#fr').value.trim(), arka = site.$('#bk').value.trim(); if (!on || !arka) return toast('iki yüzü de doldur'); deck().cards.push({ id: Date.now(), on, arka, kutu: 0, sonraki: '' }); save(); render(); site.$('#fr').focus(); return; }
  if (t.id === 'addb') { const n = site.$('#bulk').value.split('\n').map(l => l.split(';')).filter(p => p.length >= 2 && p[0].trim()).map((p, i) => ({ id: Date.now() + i, on: p[0].trim(), arka: p.slice(1).join(';').trim(), kutu: 0, sonraki: '' })); deck().cards.push(...n); save(); toast(n.length + ' kart eklendi'); render(); return; }
  if (t.closest('[data-delc]')) { const d = deck(); d.cards = d.cards.filter(c => c.id != t.closest('[data-delc]').dataset.delc); save(); render(); return; }
  if (t.id === 'del') { if (confirm('Deste ve içindeki tüm kartlar silinsin mi?')) { S.decks = S.decks.filter(d => d.id !== view.id); save(); view = { name: 'list' }; render(); } return; }
  if (t.closest('#card')) { site.$('#card').classList.toggle('on'); return; }
  if (t.closest('#yes')) return answer(true);
  if (t.closest('#no')) return answer(false);
};
app.onchange = e => { if (e.target.id === 'rn' && e.target.value.trim()) { deck().ad = e.target.value.trim(); save(); } };
addEventListener('keydown', e => {
  if (view.name !== 'study' || /INPUT|TEXTAREA/.test(e.target.tagName) || !site.$('#card')) return;
  if (e.key === ' ') { e.preventDefault(); site.$('#card').classList.toggle('on'); }
  if (e.key === '1') answer(false);
  if (e.key === '2') answer(true);
});
render();
</script>
</body>
</html>
