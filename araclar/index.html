function render() {
  const q = site.norm(site.$('#q').value.trim());
  site.$('#list').innerHTML = GROUPS.map(([k, title, c, items]) => {
    const hit = items.filter(([n, , d]) => !q || site.norm(title + ' ' + n + ' ' + d).includes(q));
    return hit.length ? `<h2 class="sec">${title}</h2><div class="grid">${hit.map(([n, u, d]) => `<a class="tile" href="${u}"><span class="ico" style="--c:${c}">${ICON[k]}</span><div><b>${n}</b><span>${d}</span></div></a>`).join('')}</div>` : '';
  }).join('') || '<p class="hint" style="margin-top:2rem">Bu aramaya uyan araç yok.</p>';
}
site.$('#q').oninput = render;
render();
// Son kullanılanlar
{
  const r = site.recent('/araclar/').filter(x => x[1] !== '/araclar/').slice(0, 6), el = site.$('#recent');
  if (r.length) { el.hidden = false; el.innerHTML = 'son kullandıkların: ' + r.map(([t, u]) => `<a class="chip" href="${u}">${site.esc(t)}</a>`).join(''); }
}
