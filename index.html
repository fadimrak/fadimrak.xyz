<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fadimrak</title>
<meta name="theme-color" content="#a3c9ee">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Gramatika Black'; src: local('Gramatika Black'), local('Gramatika-Black'); font-weight: 900; }
  :root { --sky: #a3c9ee; --ink: #2f5a8a; --ease-spring: cubic-bezier(.2, 1.5, .4, 1); }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--sky); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; animation: fade 2s ease both; }
  /* ismin arkasında nefes alan yumuşak ışık */
  body::after { content: ''; position: fixed; left: 50%; top: 50%; width: min(90vw, 900px); aspect-ratio: 2; translate: -50% -50%; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, #ffffff40, #ffffff00); animation: breathe 7s ease-in-out infinite, fade 2s .3s ease both; }

  button { all: unset; cursor: pointer; display: flex; user-select: none; touch-action: manipulation; padding: .2em .3em;
    font: 900 clamp(3rem, 13vw, 7.5rem) / 1 'Gramatika Black', system-ui, sans-serif; letter-spacing: -.01em; color: #fff;
    transition: letter-spacing .6s var(--ease-spring); will-change: transform; }
  button:hover { letter-spacing: .04em; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 12px; }
  button span { display: inline-block; text-shadow: 0 0 .3em #ffffff60, 0 .05em .25em #2f5a8a66;
    animation: rise 1.1s calc(var(--i) * 70ms + .4s) var(--ease-spring) both, float 4.5s calc(var(--i) * -.45s) ease-in-out infinite; }
  button span i { display: inline-block; font-style: normal; transition: transform .5s var(--ease-spring); }
  button.pop span i { animation: pop .6s calc(var(--i) * 40ms) var(--ease-spring); }

  #toast { position: fixed; bottom: max(2rem, env(safe-area-inset-bottom)); left: 50%; display: flex; align-items: center; gap: .55rem;
    padding: .7rem 1.2rem .7rem .8rem; border-radius: 999px; border: 1px solid #ffffffb0;
    background: #ffffff5c; backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 10px 40px #2f5a8a30, inset 0 1px 0 #ffffffc0;
    color: var(--ink); font: 650 .95rem system-ui, sans-serif; white-space: nowrap;
    translate: -50% 140%; opacity: 0; transition: translate .5s var(--ease-spring), opacity .3s; pointer-events: none; }
  #toast.show { translate: -50% 0; opacity: 1; }
  #toast svg { width: 22px; height: 22px; flex: none; }
  #toast circle { fill: var(--ink); }
  #toast path { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; }
  #toast.show path { transition: stroke-dashoffset .4s .2s ease; stroke-dashoffset: 0; }

  @keyframes fade { from { opacity: 0; } }
  @keyframes breathe { 50% { scale: 1.12; opacity: .75; } }
  @keyframes rise { from { opacity: 0; filter: blur(14px); transform: translateY(.45em) scale(.85); } }
  @keyframes float { 50% { translate: 0 -.06em; } }
  @keyframes pop { 40% { transform: translateY(-.22em) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { *, ::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="topo"></canvas>
<button aria-label="fadimrak, discord ismini kopyala"></button>
<div id="toast" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12"/><path d="m7 12.5 3.2 3.2L17 9"/></svg>discord ismi kopyalandı</div>
<script src="topography.js"></script>
<script>
const b = document.querySelector('button'), toast = document.getElementById('toast');
b.innerHTML = [...'fadimrak'].map((c, i) => `<span style="--i:${i}" aria-hidden="true"><i>${c}</i></span>`).join('');
const topo = new TopographyEngine('topo', { backdrop: '#a3c9ee', lowColor: '#bcd8f3', midColor: '#d6e8f9', highColor: '#f2f8ff', scale: 0.8, bands: 6, morphAmount: 1.5, speed: 0.2, glow: 0.15, grainIntensity: 0.015, avoid: b, avoidPad: 30 });

// harfler imlece doğru hafifçe eğilir (mıknatıs etkisi)
const letters = [...b.querySelectorAll('i')];
addEventListener('pointermove', e => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (const l of letters) {
    const r = l.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const f = Math.max(0, 1 - Math.hypot(dx, dy) / 260);
    l.style.transform = `translate(${dx * f * .12}px, ${dy * f * .12}px) rotate(${dx * f * .03}deg)`;
  }
}, { passive: true });
document.addEventListener('pointerleave', () => letters.forEach(l => l.style.transform = ''));

let t;
b.onclick = e => {
  topo.pulse(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  const done = () => {
    toast.classList.add('show');
    clearTimeout(t);
    t = setTimeout(() => toast.classList.remove('show'), 2200);
  };
  // pano API'si yoksa veya izin verilmezse eski yöntem
  const legacy = () => {
    const ta = Object.assign(document.createElement('textarea'), { value: 'fadimrak' });
    document.body.append(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) done();
  };
  navigator.clipboard ? navigator.clipboard.writeText('fadimrak').then(done, legacy) : legacy();
};
</script>
</body>
</html>
