<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fadimrak</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Gramatika Black'; src: local('Gramatika Black'), local('Gramatika-Black'); font-weight: 900; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #eaf2ff; }
  button { all: unset; cursor: pointer; font: 900 clamp(2.5rem, 10vw, 5rem) 'Gramatika Black', system-ui, sans-serif; color: #10204a; user-select: none; }
  button:focus-visible { outline: 2px solid #10204a; outline-offset: 8px; border-radius: 6px; }
</style>
</head>
<body>
<button aria-label="discord kullanıcı adını kopyala">fadimrak</button>
<script>
const b = document.querySelector('button');
b.onclick = () => navigator.clipboard.writeText('fadimrak').then(() => {
  b.textContent = 'kopyalandı';
  setTimeout(() => b.textContent = 'fadimrak', 1000);
});
</script>
</body>
</html>
