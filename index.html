  .links .st svg, .mini svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mini { display: flex; gap: .9rem; margin-top: .1rem; animation-delay: .75s; }
  .mini button { all: unset; cursor: pointer; color: #555; display: flex; transition: color .3s; }
  .mini button:hover, .mini button:focus-visible { color: #e6e6e6; }
  .mini svg { width: 15px; height: 15px; }
  a:focus-visible, .mini button:focus-visible { outline: 1px solid #777; outline-offset: 4px; border-radius: 4px; }
  html[data-theme=light] { filter: invert(1); }
  html[data-theme=light].inv { filter: none; }
  .card { transition: transform .25s ease-out; will-change: transform; }
  canvas { transform: scale(1.08); transition: transform .4s ease-out; }
  .count { margin: 0; display: flex; align-items: center; gap: .35rem; color: #555; font-size: .7rem; animation-delay: .9s; }
  .count svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translate(-50%, 10px); padding: .5rem 1rem; background: #111; border: 1px solid #222; border-radius: 8px; color: #aaa; font-size: .8rem; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .foot { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: .4rem; color: #555; font-size: .7rem; opacity: 0; animation: in 1.2s 1.1s ease forwards; }
  .foot a { color: #666; text-decoration: underline; text-underline-offset: 2px; }
  html { transition: filter .6s; }
  html.inv { filter: invert(1); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }

<script>new TopographyEngine('topo', { lowColor: '#0a0a0a', midColor: '#555555', highColor: '#bbbbbb', scale: 0.8, bands: 6, morphAmount: 1.5, speed: 0.2, glow: 0.15, grainIntensity: 0.02 });</script>
<script>
const card = document.querySelector('.card'), topo = document.getElementById('topo');

// konsol mesajı
console.log('%c' + String.raw`
  __           _ _                     _
 / _| __ _  __| (_)_ __ ___  _ __ __ _| | __
| |_ / _' |/ _' | | '_ ' _ \| '__/ _' | |/ /
|  _| (_| | (_| | | | | | | | | | (_| |   <
|_|  \__,_|\__,_|_|_| |_| |_|_|  \__,_|_|\_\
`, 'color:#e6e6e6;font-family:monospace');
console.log("%cmerak ettin demek. 07.2027'de görüşürüz.", 'color:#777');

// kart eğilmesi (fare) + arka plan kayması (telefon)
addEventListener('mousemove', e => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  card.style.transform = `perspective(800px) rotateX(${-y * 8}deg) rotateY(${x * 8}deg)`;
});
document.addEventListener('mouseleave', () => card.style.transform = '');
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  const x = Math.max(-1, Math.min(1, e.gamma / 30)), y = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  topo.style.transform = `scale(1.08) translate(${x * -2}%, ${y * -2}%)`;
});

// discord kullanıcı adını kopyala
document.querySelector('a[href*=discord]').addEventListener('click', e => {
  e.preventDefault();
  navigator.clipboard.writeText('fadimrak').then(() => toast('fadimrak kopyalandı'), () => toast('discord: fadimrak'));
});

// konami kodu
const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let k = 0;
addEventListener('keydown', e => {
  k = e.key.toLowerCase() === konami[k].toLowerCase() ? k + 1 : (e.key === konami[0] ? 1 : 0);
  if (k === konami.length) {
    k = 0;
    toast(document.documentElement.classList.toggle('inv') ? 'ışıklar açıldı' : 'ışıklar kapandı');
  }
});

// ortak ziyaretçi sayacı (oturum başına bir kez artar)
(async () => {
  let seen = false;
  try { seen = sessionStorage.getItem('v') === '1'; sessionStorage.setItem('v', '1'); } catch {}
  try {
    const r = await fetch(`https://abacus.jasoncameron.dev/${seen ? 'get' : 'hit'}/fadimrak-xyz/visits`);
    const { value } = await r.json();
    if (value) document.getElementById('count').textContent = value.toLocaleString('tr-TR');
  } catch {}
})();
</script>
