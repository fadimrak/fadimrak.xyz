<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fadimrak</title>
<meta name="theme-color" content="#a3c9ee">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Gramatika Black'; src: local('Gramatika Black'), local('Gramatika-Black'); font-weight: 900; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #a3c9ee; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
  button { all: unset; cursor: pointer; user-select: none; padding: .2em .3em; font: 900 clamp(3rem, 13vw, 7.5rem) / 1 'Gramatika Black', system-ui, sans-serif; color: #fff; text-shadow: 0 .04em .25em #2f5a8a55; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 12px; }
  #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); padding: .7rem 1.2rem; border-radius: 999px; background: #ffffffd9; color: #2f5a8a; font: 650 .95rem system-ui, sans-serif; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="topo"></canvas>
<button aria-label="fadimrak, discord ismini kopyala">fadimrak</button>
<div id="toast" role="status" hidden>discord ismi kopyalandı</div>
<script src="topography.js"></script>
<script>
const b = document.querySelector('button'), toast = document.getElementById('toast');
new TopographyEngine('topo', { avoid: b });

let t;
const done = () => {
  toast.hidden = false;
  clearTimeout(t);
  t = setTimeout(() => toast.hidden = true, 2000);
};
// pano API'si yoksa veya izin verilmezse eski yöntem
const legacy = () => {
  const ta = Object.assign(document.createElement('textarea'), { value: 'fadimrak' });
  document.body.append(ta); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  if (ok) done();
};
b.onclick = () => navigator.clipboard ? navigator.clipboard.writeText('fadimrak').then(done, legacy) : legacy();
</script>
</body>
</html>
