<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; background: #0a0a0a; color: #e6e6e6; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .card { display: flex; flex-direction: column; align-items: center; gap: .75rem; padding: 2.5rem 3rem; background: rgba(10,10,10,.75); border: 1px solid #222; border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .card > * { opacity: 0; animation: in 1.2s ease forwards; }
  #topo { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: .35; }
  h1 { margin: 0; font-size: 2.5rem; font-weight: 400; letter-spacing: .15em; }
  .links { margin-top: .25rem; display: flex; gap: 1.1rem; animation-delay: .6s; }
  .links a { flex-direction: column; align-items: center; gap: .35rem; min-width: 44px; padding: .3rem .15rem; border-radius: 8px; font-size: .64rem; letter-spacing: .04em; text-decoration: none; }
  .links a:hover { background: rgba(255,255,255,.05); }
  a { color: #777; display: flex; transition: color .3s; }
  a:hover { color: #e6e6e6; }
  a svg { width: 22px; height: 22px; fill: currentColor; }
  .links .st svg, .mini svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mini { display: flex; gap: .9rem; margin-top: .1rem; animation-delay: .75s; }
  .mini button { all: unset; cursor: pointer; color: #555; display: flex; transition: color .3s; }
  .mini button:hover, .mini button:focus-visible { color: #e6e6e6; }
  .mini svg { width: 15px; height: 15px; }
  .mini .dc { color: #555; } .mini .dc:hover { color: #e6e6e6; }
  .mini .dc svg { fill: currentColor; stroke: none; }
  a:focus-visible, .mini button:focus-visible { outline: 1px solid #777; outline-offset: 4px; border-radius: 4px; }
  html[data-theme=light] { filter: invert(1); }
  html[data-theme=light].inv { filter: none; }
  .card { position: relative; z-index: 1; transition: transform .25s ease-out; will-change: transform; }
  #topo { transform: scale(1.08); transition: transform .4s ease-out; }
  /* Kartın etrafında dönen yılan halkası. Videodaki hareket tek bir resmin dönmesinden ibaret olduğu için
     resim CSS ile döndürülür: tarayıcının kompozit katmanında çalışır, takılmaz. Yılan kartın önünde durur. */
  .stage { position: relative; display: grid; place-items: center; }
  #ouro { --s: 600px; position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); z-index: 2; pointer-events: none; user-select: none; opacity: 0; animation: fade 1.6s .4s ease forwards;
    overflow: hidden; border-radius: 50%; } /* dönen kare resmin köşeleri ekrandan taşıp telefonda sayfayı uzaklaştırmasın */
  #ouro img { display: block; width: 100%; height: 100%; will-change: transform; animation: spin 10s linear infinite; }
  .count { margin: 0; display: flex; align-items: center; gap: .35rem; color: #555; font-size: .7rem; animation-delay: .9s; }
  .count svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translate(-50%, 10px); padding: .5rem 1rem; background: #111; border: 1px solid #222; border-radius: 8px; color: #aaa; font-size: .8rem; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .foot { position: fixed; bottom: 14px; left: 0; right: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: .45rem; text-align: center; color: #555; font-size: .7rem; opacity: 0; animation: in 1.2s 1.1s ease forwards; }
  .foot a { color: #666; text-decoration: underline; text-underline-offset: 2px; display: inline; }
  .foot .oss { display: inline-flex; align-items: center; gap: .45rem; color: #888; text-decoration: none; font-size: .72rem; }
  .foot .oss:hover { color: #e6e6e6; }
  .foot .oss svg { width: 15px; height: 15px; fill: currentColor; }
  html { transition: filter .6s; }
  html.inv { filter: invert(1); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  body { overflow: hidden; }
  @media (max-width: 480px) { .card { padding: 1.5rem 1.2rem; gap: .6rem; } h1 { font-size: 1.75rem; } .links { gap: .35rem; } }
</style>

<script src="topography.js"></script>
<script>new TopographyEngine('topo', { lowColor: '#0a0a0a', midColor: '#555555', highColor: '#bbbbbb', scale: 0.8, bands: 6, morphAmount: 1.5, speed: 0.2, glow: 0.15, grainIntensity: 0.02 });</script>
<script>
const card = document.querySelector('.card'), topo = document.getElementById('topo');

// konsol mesajı
console.log('%c' + String.raw`
  __           _ _                     _
 / _| __ _  __| (_)_ __ ___  _ __ __ _| | __
| |_ / _' |/ _' | | '_ ' _ \| '__/ _' | |/ /
|  _| (_| | (_| | | | | | | | | | (_| |   <
|_|  \__,_|\__,_|_|_| |_| |_|_|  \__,_|_|\_\
`, 'color:#e6e6e6;font-family:monospace');
console.log('%cmerak ettin demek.', 'color:#777');

// kart eğilmesi (fare) + arka plan kayması (telefon)
addEventListener('mousemove', e => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  card.style.transform = `perspective(800px) rotateX(${-y * 8}deg) rotateY(${x * 8}deg)`;
});
document.addEventListener('mouseleave', () => card.style.transform = '');
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  const x = Math.max(-1, Math.min(1, e.gamma / 30)), y = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  topo.style.transform = `scale(1.08) translate(${x * -2}%, ${y * -2}%)`;
});

// discord kullanıcı adını kopyala
document.querySelector('a[href*=discord]').addEventListener('click', e => {
  e.preventDefault();
  navigator.clipboard.writeText('fadimrak').then(() => toast('fadimrak kopyalandı'), () => toast('discord: fadimrak'));
});

// konami kodu
const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let k = 0;
addEventListener('keydown', e => {
  k = e.key.toLowerCase() === konami[k].toLowerCase() ? k + 1 : (e.key === konami[0] ? 1 : 0);
  if (k === konami.length) {
    k = 0;
    toast(document.documentElement.classList.toggle('inv') ? 'ışıklar açıldı' : 'ışıklar kapandı');
  }
});

// Yılan halkası: ekranın kısa kenarının çoğunu kaplasın; büyüdükçe başı kartın yazılarının üstünden daha az geçer
{
  const ouro = document.getElementById('ouro');
  const size = () => {
    const short = Math.min(document.documentElement.clientWidth, document.documentElement.clientHeight);
    ouro.style.setProperty('--s', Math.round(Math.min(Math.max(Math.hypot(card.offsetWidth, card.offsetHeight) / .7, short * .92), short * .98, 1100)) + 'px');
  };
  addEventListener('resize', size); size();
}

// ortak ziyaretçi sayacı (oturum başına bir kez artar)
(async () => {
  let seen = false;
  try { seen = sessionStorage.getItem('v') === '1'; sessionStorage.setItem('v', '1'); } catch {}
  try {
    const r = await fetch(`https://abacus.jasoncameron.dev/${seen ? 'get' : 'hit'}/fadimrak-xyz/visits`);
    const { value } = await r.json();
    if (value) document.getElementById('count').textContent = value.toLocaleString('tr-TR');
  } catch {}
})();
</script>
