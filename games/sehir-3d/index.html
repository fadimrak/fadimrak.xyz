<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>şehir turu · fadimrak</title>
<meta name="description" content="Rengârenk, sonu olmayan bir şehirde sürücü koltuğundan araba sür.">
<meta name="theme-color" content="#9fd8ff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Gramatika'; font-weight: 900; font-display: swap; src: local('Gramatika Black'), local('Gramatika-Black'); }
  :root { --ink: #1c1a17; --card: #fffdf8; --muted: #6f685d; --accent: #ff5a4e; --head: 'Gramatika', 'Outfit', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; background: #9fd8ff; font-family: 'Outfit', system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; display: block; }
  a { color: inherit; }
  button { font: inherit; font-weight: 800; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: .65rem 1.1rem; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button.primary { background: var(--accent); color: #fff; }
  .back { position: fixed; top: 14px; left: 16px; z-index: 6; padding: .45rem .8rem; border: 2px solid var(--ink); border-radius: 99px; background: var(--card); text-decoration: none; font-weight: 700; font-size: .85rem; box-shadow: 2px 2px 0 var(--ink); }
  .hud { position: fixed; top: 64px; left: 16px; z-index: 3; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .chip { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); padding: .35rem .7rem; font-weight: 700; font-size: .85rem; }
  .chip b { font-family: var(--head); font-weight: 900; font-size: 1.2rem; }
  .chip.low { background: var(--accent); color: #fff; }
  .compass { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3; width: 58px; height: 58px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; pointer-events: none; }
  .compass svg { width: 30px; height: 30px; transition: transform .1s; }
  .compass small { position: absolute; bottom: -1.25rem; font-weight: 800; font-size: .72rem; background: var(--ink); color: #fff; border-radius: 99px; padding: 0 .45rem; white-space: nowrap; }
  .gauge { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3; text-align: center; color: #fff; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .gauge b { font-family: var(--head); font-weight: 900; font-size: 2.4rem; line-height: 1; display: block; }
  .gauge span { font-weight: 700; font-size: .75rem; opacity: .85; }
  .toast { position: fixed; top: 100px; left: 50%; transform: translate(-50%, -10px); padding: .6rem 1rem; background: var(--ink); color: #fff; border-radius: 12px; font-weight: 700; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 7; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(159, 216, 255, .5); backdrop-filter: blur(3px); padding: 16px; }
  .panel { max-width: 400px; text-align: center; background: var(--card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); padding: 1.4rem; }
  .panel h1 { font-family: var(--head); font-weight: 900; margin: 0 0 .3rem; font-size: 2.4rem; }
  .panel p { color: var(--muted); line-height: 1.55; margin: .5rem 0; }
  .row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
  kbd { font-family: inherit; font-weight: 800; border: 2px solid var(--ink); border-radius: 6px; padding: 0 .3rem; background: #fff; color: var(--ink); }
  .foot { font-size: .75rem; margin-top: 1rem !important; }
  .pad { position: fixed; bottom: 16px; z-index: 4; display: none; gap: 12px; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; padding: 0; font-size: 1.3rem; }
  .pad button.on { background: #ffd23f; transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .pad.l { left: 16px; } .pad.r { right: 16px; flex-direction: column; }
  @media (pointer: coarse) { .pad { display: flex; } .gauge { bottom: 110px; } }
</style>
</head>
<body>
<a class="back" href="../">← oyunlar</a>
<div class="hud" id="hud" hidden>
  <div class="chip">yıldız <b id="score">0</b></div>
  <div class="chip" id="timeChip">süre <b id="time">60</b></div>
</div>
<div class="compass" id="compass" hidden><svg viewBox="0 0 24 24" id="arrow"><path d="M12 2 20 20 12 15 4 20Z" fill="#ff9f1c" stroke="#1c1a17" stroke-width="2" stroke-linejoin="round"/></svg><small id="dist"></small></div>
<div class="gauge"><b id="spd">0</b><span>km/s</span></div>
<div class="pad l"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad r"><button data-k="up">▲</button><button data-k="down">▼</button></div>
<div class="overlay" id="menu"><div class="panel">
  <h1 id="title">şehir turu</h1>
  <p id="desc">Sonu olmayan bir şehirde direksiyon senin. Yıldızları topla, her yıldız süreye 6 saniye ekler.</p>
  <p id="help"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> ya da ok tuşları, <kbd>boşluk</kbd> el freni</p>
  <div class="row"><button class="primary" data-mode="time">zamana karşı</button><button data-mode="free">serbest sür</button></div>
  <p id="bestLine"></p>
  <p class="foot">fadimrak tarafından yapılmıştır · <a href="/telif/">telif hakları</a></p>
</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
if (matchMedia('(pointer: coarse)').matches) $('help').textContent = 'Soldaki tuşlarla direksiyonu çevir, sağdakilerle gaz ve fren.';
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let toastTimer;
function toast(msg, ms = 1800) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.append(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ——— şehir düzeni: sonsuz ızgara, her blok koordinatına göre hep aynı üretilir
const BLOCK = 46, ROAD = 18, CELL = BLOCK + ROAD, CHUNK = 3, CH = CELL * CHUNK, VIEW = 2;
const hash = (a, b, s = 0) => { let h = (a * 374761393 + b * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const blockType = (i, j) => hash(i, j, 1) < .16 ? 'park' : hash(i, j, 2) < .05 ? 'pool' : 'city';
const PALETTE = ['#ff8a80', '#ffd180', '#ffe57f', '#a7ffeb', '#80d8ff', '#b388ff', '#ff80ab', '#ccff90', '#f8bbd0', '#90caf9', '#fff59d', '#ffab91', '#ce93d8', '#80cbc4'];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color('#9fd8ff');
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 120, 320);
const camera = new THREE.PerspectiveCamera(74, 1, .05, 900);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight('#ffffff', '#8aa0b8', 1.6));
const sun = new THREE.DirectionalLight('#fff4dc', 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 1, far: 300 });
sun.shadow.bias = -.0005;
scene.add(sun, sun.target);

const BOX = new THREE.BoxGeometry(1, 1, 1);
const lambert = c => new THREE.MeshLambertMaterial({ color: c });
const M = { walk: lambert('#e6dfd0'), grass: lambert('#7fd36b'), trunk: lambert('#9b6b43'), dash: lambert('#fffbe8'), water: new THREE.MeshLambertMaterial({ color: '#4fc3f7', transparent: true, opacity: .9 }), tint: lambert('#ffffff') };
const LEAF = new THREE.IcosahedronGeometry(1, 0), TRUNK = new THREE.CylinderGeometry(.35, .45, 1, 6);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), lambert('#596273'));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

const chunks = new Map();
const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), col = new THREE.Color();
function instanced(geo, mat, list, shadow = true) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
  list.forEach(([x, y, z, sx, sy, sz, c, ry = 0], k) => {
    q4.setFromAxisAngle(v3.set(0, 1, 0), ry);
    m.setMatrixAt(k, m4.compose(v3.set(x, y, z), q4, s3.set(sx, sy, sz)));
    if (c) m.setColorAt(k, col.set(c));
  });
  m.count = list.length;
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
function buildChunk(cx, cz) {
  const g = new THREE.Group(), slabs = [], grass = [], pools = [], blds = [], roofs = [], trunks = [], leaves = [], dashes = [];
  for (let a = 0; a < CHUNK; a++) for (let b = 0; b < CHUNK; b++) {
    const i = cx * CHUNK + a, j = cz * CHUNK + b, x = i * CELL + CELL / 2, z = j * CELL + CELL / 2, t = blockType(i, j);
    slabs.push([x, .15, z, BLOCK, .3, BLOCK]);
    if (t !== 'city') {
      grass.push([x, .32, z, BLOCK - 4, .1, BLOCK - 4]);
      if (t === 'pool') pools.push([x, .4, z, BLOCK * .55, .1, BLOCK * .55]);
      const n = 6 + Math.floor(hash(i, j, 3) * 8);
      for (let k = 0; k < n; k++) {
        const tx = x + (hash(i, j, 10 + k) - .5) * (BLOCK - 8), tz = z + (hash(i, j, 40 + k) - .5) * (BLOCK - 8);
        if (t === 'pool' && Math.abs(tx - x) < BLOCK * .32 && Math.abs(tz - z) < BLOCK * .32) continue;
        const h = 2.5 + hash(i, j, 70 + k) * 2;
        trunks.push([tx, h / 2 + .3, tz, 1, h, 1]);
        leaves.push([tx, h + 2, tz, 2.6 + hash(i, j, 90 + k), 2.4 + hash(i, j, 95 + k), 2.6, hash(i, j, 99 + k) < .5 ? '#3fae5a' : '#69c34f']);
      }
    } else {
      const split = hash(i, j, 4) < .45 ? 2 : 1, sub = BLOCK / split;
      for (let p = 0; p < split; p++) for (let q = 0; q < split; q++) {
        const r = hash(i, j, 20 + p * 2 + q);
        const h = r < .1 ? 45 + r * 300 : 8 + hash(i, j, 30 + p * 2 + q) * (split === 1 ? 32 : 22);
        const bx = x - BLOCK / 2 + sub * (p + .5), bz = z - BLOCK / 2 + sub * (q + .5), w = sub - 5;
        const c = PALETTE[Math.floor(hash(i, j, 50 + p * 2 + q) * PALETTE.length)];
        blds.push([bx, h / 2 + .3, bz, w, h, w, c]);
        col.set(c).offsetHSL(0, 0, -.18);
        const dark = '#' + col.getHexString();
        roofs.push([bx, h + .6, bz, w + .8, 1.2, w + .8, dark]);
        for (let f = 4; f < h - 2; f += 4) roofs.push([bx, f + .3, bz, w + .12, .35, w + .12, dark]); // kat şeritleri
        if (hash(i, j, 60 + p) < .5) roofs.push([bx + w * .2, h + 2, bz - w * .15, w * .3, 2.6, w * .3, '#eceff1']);
      }
    }
  }
  for (let a = 0; a < CHUNK; a++) {
    const line = (cx * CHUNK + a) * CELL, lineZ = (cz * CHUNK + a) * CELL;
    for (let s = 0; s < CH; s += 8) {
      const off = s % CELL; if (off < ROAD / 2 + 2 || off > CELL - ROAD / 2 - 6) continue;
      dashes.push([line, .02, cz * CH + s + 2, .35, .04, 3.5]);
      dashes.push([cx * CH + s + 2, .02, lineZ, 3.5, .04, .35]);
    }
  }
  g.add(instanced(BOX, M.walk, slabs, false), instanced(BOX, M.grass, grass, false), instanced(BOX, M.dash, dashes, false));
  if (pools.length) g.add(instanced(BOX, M.water, pools, false));
  if (blds.length) g.add(instanced(BOX, M.tint, blds), instanced(BOX, M.tint, roofs));
  if (trunks.length) g.add(instanced(TRUNK, M.trunk, trunks), instanced(LEAF, M.tint, leaves));
  scene.add(g);
  return g;
}
function updateChunks(px, pz) {
  const ccx = Math.floor(px / CH), ccz = Math.floor(pz / CH), want = new Set();
  for (let a = -VIEW; a <= VIEW; a++) for (let b = -VIEW; b <= VIEW; b++) {
    const key = (ccx + a) + ',' + (ccz + b); want.add(key);
    if (!chunks.has(key)) chunks.set(key, buildChunk(ccx + a, ccz + b));
  }
  for (const [key, g] of chunks) if (!want.has(key)) { scene.remove(g); g.traverse(o => o.isInstancedMesh && o.dispose()); chunks.delete(key); }
}

// çarpışma: binalı blokların dikdörtgeni; park ve havuz kenarına girilebilir
const R = 2;
function solid(x, z) {
  const i = Math.floor(x / CELL), j = Math.floor(z / CELL), lx = x - i * CELL, lz = z - j * CELL;
  if (!(lx > ROAD / 2 - R && lx < CELL - ROAD / 2 + R && lz > ROAD / 2 - R && lz < CELL - ROAD / 2 + R)) return false;
  const t = blockType(i, j);
  if (t === 'city') return true;
  if (t === 'pool') return Math.abs(lx - CELL / 2) < BLOCK * .28 + R && Math.abs(lz - CELL / 2) < BLOCK * .28 + R;
  return false;
}

// ——— trafikteki arabalar
const BODY = {};
function carModel(color) {
  const g = new THREE.Group();
  const add = (geo, c, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(geo, BODY[c] || (BODY[c] = lambert(c))); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true; g.add(m); return m; };
  add(BOX, color, 0, 1, 0, 2.6, .9, 4.6);
  add(BOX, color, 0, 1.75, -.35, 2.2, .75, 2.4);
  add(BOX, '#bfe9ff', 0, 1.78, -.33, 2.25, .55, 2.2);
  add(BOX, '#fff59d', -.8, 1.05, 2.31, .5, .3, .05); add(BOX, '#fff59d', .8, 1.05, 2.31, .5, .3, .05);
  add(BOX, '#b71c1c', -.85, 1.05, -2.31, .45, .25, .05); add(BOX, '#b71c1c', .85, 1.05, -2.31, .45, .25, .05);
  for (const [x, z] of [[-1.3, 1.5], [1.3, 1.5], [-1.3, -1.5], [1.3, -1.5]]) add(WHEEL, '#263238', x, .5, z, 1, 1, 1).rotation.z = Math.PI / 2;
  return g;
}
const WHEEL = new THREE.CylinderGeometry(.5, .5, .45, 14);

// ——— oyuncunun arabası: sürücü koltuğundan görünen kokpit (yerel +z ileri)
const car = new THREE.Group();
scene.add(car);
const RED = lambert('#ff4b3e'), DARK = lambert('#2b2d42'), TRIM = lambert('#3d405b');
const part = (geo, mat, x, y, z, sx, sy, sz, parent = car) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); parent.add(m); return m; };
part(BOX, RED, 0, 1.02, 1.75, 2.6, .3, 1.9).rotation.x = .06;      // kaput
part(BOX, DARK, 0, 1.2, .85, 2.5, .38, .55);                         // torpido
part(BOX, TRIM, 0, 1.4, 1.05, 2.5, .06, .2);                         // torpido üst çizgisi
for (const s of [-1, 1]) {
  part(BOX, RED, s * 1.2, 1.75, .78, .12, 1.15, .14).rotation.x = -.45; // ön direkler
  part(BOX, RED, s * 1.38, 1.45, .7, .1, .22, .32);                     // yan aynalar
  part(BOX, RED, s * 1.3, 1.25, -.2, .1, .5, 2.2);                      // kapılar
}
part(BOX, lambert('#e8e0d2'), 0, 2.55, -.45, 2.5, .08, 1.9);         // tavan döşemesi
part(BOX, TRIM, 0, 2.5, .5, 2.4, .08, .1);                           // ön cam üst kenarı
part(BOX, lambert('#cfd8dc'), .05, 2.38, .55, .28, .07, .03);            // dikiz aynası
// sürücü solda: kamera +z'ye baktığında arabanın +x tarafı ekranın solunda kalır
const wheel = new THREE.Group(); wheel.position.set(.48, 1.44, .72); wheel.rotation.x = -.45; car.add(wheel);
part(new THREE.TorusGeometry(.24, .04, 8, 24), DARK, 0, 0, 0, 1, 1, 1, wheel);
part(BOX, DARK, 0, 0, 0, .46, .05, .04, wheel); part(BOX, DARK, 0, -.11, 0, .05, .22, .04, wheel);
part(new THREE.CylinderGeometry(.07, .07, .05, 12), lambert('#ff9f1c'), 0, 0, -.02, 1, 1, 1, wheel).rotation.x = Math.PI / 2;
car.add(camera);
camera.position.set(.48, 1.92, -.1);
camera.rotation.set(-.08, Math.PI, 0); // kamera -z'ye bakar, arabanın önü +z

const traffic = [];
const TCOL = ['#4d7cfe', '#ffd23f', '#3bb273', '#ffffff', '#8f5cf7', '#ff9f1c', '#1fb5a8', '#ff6fae'];
for (let k = 0; k < 14; k++) { const t = carModel(TCOL[k % TCOL.length]); t.userData = {}; scene.add(t); traffic.push(t); }
function placeTraffic(t, near) {
  const u = t.userData, ang = Math.random() * Math.PI * 2, d = near ? 40 + Math.random() * 200 : 160 + Math.random() * 100;
  const px = car.position.x + Math.sin(ang) * d, pz = car.position.z + Math.cos(ang) * d;
  u.alongX = Math.random() < .5; u.dir = Math.random() < .5 ? 1 : -1; u.speed = 9 + Math.random() * 7;
  const lane = 4.2 * u.dir; // sağdan gidiş
  if (u.alongX) { u.line = Math.round(pz / CELL) * CELL; t.position.set(px, 0, u.line - lane); t.rotation.y = u.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
  else { u.line = Math.round(px / CELL) * CELL; t.position.set(u.line + lane, 0, pz); t.rotation.y = u.dir > 0 ? 0 : Math.PI; }
}

// ——— yıldızlar
const starShape = new THREE.Shape();
for (let k = 0; k < 10; k++) { const r = k % 2 ? .9 : 2, a = k / 10 * Math.PI * 2 + Math.PI / 2; k ? starShape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : starShape.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: .6, bevelEnabled: true, bevelSize: .15, bevelThickness: .15, bevelSegments: 1 });
starGeo.center();
const starMat = new THREE.MeshLambertMaterial({ color: '#ffd23f', emissive: '#ff9f1c', emissiveIntensity: .45 });
const beamGeo = new THREE.CylinderGeometry(.6, .6, 60, 8, 1, true);
const beamMat = new THREE.MeshBasicMaterial({ color: '#ffe57f', transparent: true, opacity: .35, depthWrite: false });
const stars = [];
function spawnStar() {
  for (let t = 0; t < 50; t++) {
    const ang = Math.random() * Math.PI * 2, d = 90 + Math.random() * 180;
    let x = car.position.x + Math.sin(ang) * d, z = car.position.z + Math.cos(ang) * d;
    if (Math.random() < .5) x = Math.round(x / CELL) * CELL; else z = Math.round(z / CELL) * CELL;
    if (solid(x, z) || stars.some(s => Math.hypot(s.position.x - x, s.position.z - z) < 50)) continue;
    const s = new THREE.Group();
    const m = new THREE.Mesh(starGeo, starMat); m.castShadow = true; s.add(m);
    const beam = new THREE.Mesh(beamGeo, beamMat); beam.position.y = 30; s.add(beam);
    s.position.set(x, 3, z); scene.add(s); stars.push(s);
    return;
  }
}

// ——— kontroller
const keys = {};
const keymap = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'brake' };
addEventListener('keydown', e => { if (keymap[e.code]) { keys[keymap[e.code]] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (keymap[e.code]) keys[keymap[e.code]] = false; });
document.querySelectorAll('.pad button').forEach(b => {
  const on = v => e => { e.preventDefault(); keys[b.dataset.k] = v; b.classList.toggle('on', v); };
  b.addEventListener('pointerdown', on(true)); b.addEventListener('pointerup', on(false));
  b.addEventListener('pointerleave', on(false)); b.addEventListener('pointercancel', on(false));
});

// ——— oyun durumu
let mode = null, speed = 0, heading = 0, score = 0, timeLeft = 60, playing = false, steerVis = 0;
const showBest = () => { const b = store.get('sehir3d-best', 0); $('bestLine').textContent = b ? `rekorun: ${b} yıldız` : ''; };
showBest();
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => startGame(b.dataset.mode));
function startGame(m) {
  mode = m; playing = true; score = 0; timeLeft = 60;
  $('menu').hidden = true; $('hud').hidden = false; $('compass').hidden = false;
  $('timeChip').hidden = mode !== 'time';
  $('score').textContent = 0;
  stars.splice(0).forEach(s => scene.remove(s));
  for (let k = 0; k < 6; k++) spawnStar();
}
function endGame() {
  playing = false;
  const best = store.get('sehir3d-best', 0);
  if (score > best) store.set('sehir3d-best', score);
  $('menu').hidden = false;
  $('title').textContent = `${score} yıldız`;
  $('desc').textContent = score > best ? 'Yeni rekor!' : 'Süre bitti. Bir tur daha?';
  showBest();
}

car.position.set(0, 0, 0); // merkez kavşak
updateChunks(0, 0);
traffic.forEach(t => placeTraffic(t, true));
const clock = new THREE.Clock();
let chunkTimer = 0;

function loop() {
  const dt = Math.min(clock.getDelta(), .05);
  const acc = playing ? (keys.up ? 34 : keys.down ? -40 : 0) : 0;
  speed += acc * dt;
  speed -= speed * (keys.brake ? 3 : acc ? .55 : 1.4) * dt;
  speed = Math.max(-14, Math.min(48, speed));
  const steer = playing ? (keys.left ? 1 : 0) - (keys.right ? 1 : 0) : 0;
  heading += steer * dt * (keys.brake ? 3.2 : 2.2) * Math.min(1, Math.abs(speed) / 8) * Math.sign(speed || 1);
  const nx = car.position.x + Math.sin(heading) * speed * dt, nz = car.position.z + Math.cos(heading) * speed * dt;
  if (!solid(nx, nz)) car.position.set(nx, 0, nz);
  else if (!solid(nx, car.position.z)) { car.position.x = nx; speed *= .92; }
  else if (!solid(car.position.x, nz)) { car.position.z = nz; speed *= .92; }
  else speed *= -.35;
  car.rotation.y = heading;
  // direksiyon ve gövde hareketi
  steerVis += (steer - steerVis) * Math.min(1, dt * 8);
  wheel.rotation.z = steerVis * 1.6;
  car.rotation.z = -steerVis * Math.min(1, Math.abs(speed) / 30) * .035;
  camera.position.y = 1.92 + Math.sin(performance.now() / 70) * Math.min(.012, Math.abs(speed) / 4000);
  $('spd').textContent = Math.round(Math.abs(speed) * 3.6);

  if ((chunkTimer += dt) > .3) { chunkTimer = 0; updateChunks(car.position.x, car.position.z); }

  // trafik: kendi şeridinde düz gider, uzaklaşınca yakında yeniden belirir
  traffic.forEach(t => {
    const u = t.userData;
    if (u.alongX) t.position.x += u.dir * u.speed * dt; else t.position.z += u.dir * u.speed * dt;
    const d = Math.hypot(t.position.x - car.position.x, t.position.z - car.position.z);
    if (d > 280) placeTraffic(t, false);
    else if (d < 4.2) { speed *= -.4; const push = 4.3 / Math.max(d, .1); car.position.x = t.position.x + (car.position.x - t.position.x) * push; car.position.z = t.position.z + (car.position.z - t.position.z) * push; }
  });

  let nearest = null, nd = Infinity;
  stars.forEach(s => {
    s.children[0].rotation.y += dt * 2.5;
    s.position.y = 3 + Math.sin(performance.now() / 300 + s.position.x) * .5;
    const d = Math.hypot(s.position.x - car.position.x, s.position.z - car.position.z);
    if (d < nd) { nd = d; nearest = s; }
  });
  if (playing && nearest && nd < 4.5) {
    scene.remove(nearest); stars.splice(stars.indexOf(nearest), 1);
    score++; $('score').textContent = score;
    if (mode === 'time') { timeLeft += 6; toast('+6 saniye', 900); } else toast('yıldız', 700);
    spawnStar();
  }
  for (const s of stars) if (Math.hypot(s.position.x - car.position.x, s.position.z - car.position.z) > 420) { scene.remove(s); stars.splice(stars.indexOf(s), 1); spawnStar(); break; }
  if (nearest && playing) {
    const ang = Math.atan2(nearest.position.x - car.position.x, nearest.position.z - car.position.z) - heading;
    $('arrow').style.transform = `rotate(${-ang}rad)`;
    $('dist').textContent = Math.round(nd) + ' m';
  }
  if (playing && mode === 'time') {
    timeLeft -= dt;
    $('time').textContent = Math.max(0, Math.ceil(timeLeft));
    $('timeChip').classList.toggle('low', timeLeft < 10);
    if (timeLeft <= 0) endGame();
  }

  sun.position.set(car.position.x + 60, 120, car.position.z + 40);
  sun.target.position.copy(car.position);
  ground.position.set(Math.round(car.position.x / 100) * 100, 0, Math.round(car.position.z / 100) * 100);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
