<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>bağlantı · fadimrak</title>
<meta name="theme-color" content="#f6f0e4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  :root { --accent: var(--purple); --l0: #f9df6d; --l1: #a0c35a; --l2: #b0c4ef; --l3: #ba81c5; }
  main { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 560px; }
  .w { aspect-ratio: 1.45; padding: 4px; font-size: clamp(.62rem, 2.7vw, .9rem); font-weight: 800; word-break: break-word; border-radius: 12px; user-select: none; box-shadow: 2px 2px 0 var(--ink); line-height: 1.1; }
  .w.sel { background: var(--ink); color: var(--bg); transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  .solved { grid-column: 1 / -1; padding: .85rem; border: 2px solid var(--ink); border-radius: 12px; text-align: center; box-shadow: 2px 2px 0 var(--ink); animation: pop .4s; }
  .solved b { display: block; font-family: var(--head); font-weight: 900; font-size: 1.05rem; margin-bottom: .2rem; }
  .solved span { font-size: .85rem; font-weight: 600; }
  .l0 { background: var(--l0); } .l1 { background: var(--l1); } .l2 { background: var(--l2); } .l3 { background: var(--l3); }
  .lives { display: flex; gap: 7px; align-items: center; color: var(--muted); font-size: .85rem; font-weight: 600; }
  .lives i { width: 13px; height: 13px; border-radius: 50%; background: var(--red); border: 2px solid var(--ink); transition: transform .3s, opacity .3s; }
  .lives i.off { opacity: .2; transform: scale(.7); }
  .legend { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; font-size: .75rem; color: var(--muted); }
  .legend span { padding: .15rem .55rem; border-radius: 99px; border: 1.5px solid var(--ink); color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header><a class="back" href="../">← oyunlar</a><h1>bağlantı</h1><span class="tag" id="no"></span></header>
<main>
  <div class="modes" id="modes"></div>
  <p class="hint">16 kelimeyi ortak noktası olan 4'lü gruplara ayır. Dikkat: bazı kelimeler birden fazla gruba uyuyor gibi görünür.</p>
  <div class="board" id="board"></div>
  <div class="lives" id="lives"></div>
  <div class="row" id="controls">
    <button id="shuffle">🔀 karıştır</button>
    <button id="clear">seçimi kaldır</button>
    <button class="primary" id="submit" disabled>gönder</button>
  </div>
  <div class="row" id="endBtns" hidden></div>
  <div class="legend"><span class="l0">kolay</span><span class="l1">orta</span><span class="l2">zor</span><span class="l3">çok zor</span></div>
</main>
<script src="../common.js"></script>
<script src="kategoriler.js"></script>
<script>
const day = dayIndex(), MAX = 4, board = document.getElementById('board');
let mode, puzzle, st, sel = [];
const groupOf = w => puzzle.find(g => g.words.includes(w));
const mistakes = () => st.tries.filter(t => new Set(t.map(w => groupOf(w).level)).size > 1).length;
const won = () => st.solved.length === 4 && !st.lost;
const over = () => st.solved.length === 4;
const save = () => store.set('baglanti-' + mode, st);

function start(m) {
  mode = m; sel = [];
  if (mode === 'daily') {
    st = store.get('baglanti-daily', {});
    if (st.day !== day) st = { day, solved: [], tries: [] };
    puzzle = makePuzzle(rng(day * 31 + 7));
    document.getElementById('no').textContent = '#' + (day + 1);
  } else {
    st = store.get('baglanti-free', null);
    if (!st || over()) st = { seed: Math.floor(Math.random() * 1e9), solved: [], tries: [] };
    puzzle = makePuzzle(rng(st.seed));
    document.getElementById('no').textContent = 'sınırsız';
  }
  if (!st.order) st.order = shuffle(puzzle.flatMap(g => g.words));
  render();
}

function render() {
  board.innerHTML = '';
  st.solved.forEach(l => {
    const g = puzzle.find(g => g.level === l);
    board.insertAdjacentHTML('beforeend', `<div class="solved l${l}"><b>${g.name}</b><span>${g.words.join(' · ')}</span></div>`);
  });
  st.order.filter(w => !st.solved.includes(groupOf(w).level)).forEach(w => {
    const b = document.createElement('button');
    b.className = 'w' + (sel.includes(w) ? ' sel' : '');
    b.textContent = w;
    b.onclick = () => {
      if (over()) return;
      sel = sel.includes(w) ? sel.filter(x => x !== w) : sel.length < 4 ? [...sel, w] : sel;
      render();
    };
    board.append(b);
  });
  document.getElementById('lives').innerHTML = 'kalan hata ' + Array.from({ length: MAX }, (_, i) => `<i class="${i < MAX - mistakes() ? '' : 'off'}"></i>`).join('');
  document.getElementById('submit').disabled = sel.length !== 4;
  document.getElementById('controls').hidden = over();
  document.getElementById('lives').hidden = over();
  const end = document.getElementById('endBtns');
  end.hidden = !over();
  if (over()) {
    end.innerHTML = mode === 'daily'
      ? '<button class="primary" id="share">paylaş</button><button id="more">sınırsız oyna</button>'
      : '<button class="primary" id="again">yeni bulmaca</button><button id="share">paylaş</button>';
    document.getElementById('share').onclick = () => {
      const rows = st.tries.map(t => t.map(w => ['🟨', '🟩', '🟦', '🟪'][groupOf(w).level]).join('')).join('\n');
      share(`bağlantı ${mode === 'daily' ? '#' + (day + 1) : '(sınırsız)'}\n${rows}\nfadimrak.xyz/games/baglanti`);
    };
    const more = document.getElementById('more'), again = document.getElementById('again');
    if (more) more.onclick = () => document.querySelector('[data-m="free"]').click();
    if (again) again.onclick = () => { st = null; store.set('baglanti-free', null); start('free'); };
  }
  save();
}

document.getElementById('submit').onclick = () => {
  const key = sel.slice().sort().join();
  if (st.tries.some(t => t.slice().sort().join() === key)) return toast('bunu zaten denedin');
  st.tries.push(sel);
  const counts = {};
  sel.forEach(w => { const l = groupOf(w).level; counts[l] = (counts[l] || 0) + 1; });
  const best = Math.max(...Object.values(counts));
  if (best === 4) {
    st.solved.push(groupOf(sel[0]).level);
    sel = [];
    if (st.solved.length === 4) { toast(['kusursuz! 🏆', 'harika! 🔥', 'iyi iş! 👏', 'son anda! 😅'][mistakes()], 2500); confetti(); }
  } else {
    shake(board);
    toast(best === 3 ? 'bir kaldı... 🤏' : 'olmadı');
    if (mistakes() >= MAX) {
      sel = []; st.lost = true;
      puzzle.forEach(g => st.solved.includes(g.level) || st.solved.push(g.level));
      toast('bitti, cevaplar açıldı', 2500);
    }
  }
  render();
};
document.getElementById('shuffle').onclick = () => { st.order = shuffle(st.order); render(); };
document.getElementById('clear').onclick = () => { sel = []; render(); };
modeSwitch(document.getElementById('modes'), 'baglanti', start);
</script>
</body>
</html>
