<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oyunlar · fadimrak</title>
<meta name="description" content="günlük bulmacalar, küçük deneyler ve 3D oyunlar">
<meta property="og:title" content="oyunlar · fadimrak">
<meta property="og:description" content="günlük bulmacalar, küçük deneyler ve 3D oyunlar">
<meta name="theme-color" content="#f6f0e4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Ana sayfadan (ya da dışarıdan) gelince ekran siyahtan açılır; oyundan geri dönünce açılmaz
  try { if (!new URL(document.referrer).pathname.startsWith('/games/')) document.documentElement.classList.add('dawn'); }
  catch { document.documentElement.classList.add('dawn'); }
</script>
<style>
  html.dawn body { animation: dawn 1.2s cubic-bezier(.6, 0, .3, 1) both; }
  @keyframes dawn { 0%, 15% { background: #0a0a0a; } 100% { background: var(--bg); } }
  html.dawn .hero, html.dawn header { animation: in .7s .55s both; }
  .hero { text-align: center; padding: 1.5rem 0 1rem; }
  .hero h1 { margin: 0; font-size: clamp(3rem, 14vw, 5.5rem); line-height: .95; }
  .hero h1 span { display: inline-block; animation: bob 3s ease-in-out infinite; }
  .hero h1 span:nth-child(2n) { animation-delay: -1.5s; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
  .hero p { color: var(--muted); margin: .6rem 0 0; }
  h3 { font-size: 1rem; margin: 2.25rem 0 .9rem; display: flex; align-items: center; gap: .6rem; }
  h3::after { content: ''; flex: 1; height: 2px; background: var(--ink); opacity: .15; border-radius: 2px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
  .game { position: relative; display: flex; gap: 1rem; align-items: flex-start; padding: 1.1rem 1.15rem; background: var(--c); border: 2px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow); text-decoration: none; transition: transform .18s, box-shadow .18s; animation: in .5s both; overflow: hidden; }
  .game:hover { transform: translate(-2px, -3px) rotate(-.4deg); box-shadow: 6px 7px 0 var(--ink); }
  .game:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .game .ico { flex: none; width: 56px; height: 56px; display: grid; place-items: center; font-size: 1.9rem; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; transition: transform .3s; }
  .game:hover .ico { transform: rotate(-8deg) scale(1.08); }
  .game h2 { margin: .1rem 0 .3rem; font-size: 1.3rem; line-height: 1.1; }
  .game p { margin: 0; font-size: .88rem; line-height: 1.4; opacity: .85; }
  .game .pill { position: absolute; top: .7rem; right: .7rem; font-size: .68rem; font-weight: 800; letter-spacing: .04em; padding: .2rem .55rem; border-radius: 99px; background: var(--ink); color: var(--bg); }
  .game.light { color: #fff; } .game .ico { color: var(--ink); }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 3rem; }
</style>
</head>
<body>
<header><a class="back" href="/">← fadimrak</a><span></span><span></span></header>
<main>
  <div class="hero">
    <h1><span>o</span><span>y</span><span>u</span><span>n</span><span>l</span><span>a</span><span>r</span></h1>
    <p>bulmacalar, deneyler, küçük dünyalar</p>
  </div>
  <div id="list"></div>
  <footer>fadimrak tarafından yapılmıştır · <a href="/telif/">telif hakları</a></footer>
</main>
<script>
// Basit çizgi ikonlar (24x24)
const ICONS = {
  kelime: '<rect x="2" y="8" width="6" height="8" rx="1.5"/><rect x="9" y="8" width="6" height="8" rx="1.5" fill="currentColor"/><rect x="16" y="8" width="6" height="8" rx="1.5"/>',
  baglanti: '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" fill="currentColor"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" fill="currentColor"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
  sehir: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  yil: '<path d="M6 3h12M6 21h12M7 3c0 5 10 6 10 9s-10 4-10 9M17 3c0 5-10 6-10 9s10 4 10 9"/>',
  kalabalik: '<path d="M5 20V11M12 20V4M19 20v-6"/><path d="M3 20h18"/>',
  robot: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m8 12.5 3 3 5.5-6.5"/>',
  hafta: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="3"/>',
};
const icon = slug => `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[slug]}</svg>`;
const GROUPS = [
  ['günlük bulmacalar', [
    ['kelime', 'kelime', '5 harfli kelimeyi 6 denemede bul.', 'var(--green)', 'light', 'günlük'],
    ['baglanti', 'bağlantı', "16 kelimeyi 4'lü gruplara ayır.", 'var(--purple)', 'light', 'günlük'],
    ['sehir', 'şehir', 'Silüetinden ili bul.', 'var(--teal)', 'light', 'günlük'],
    ['yil', 'yıl', 'Tarihte bugün ne oldu, hangi yıl?', 'var(--orange)', '', 'günlük'],
  ]],
  ['deneyler', [
    ['kalabalik', 'hangisi daha?', 'Kalabalık mı, büyük mü, yüksek mi? Seriyi bozma.', 'var(--pink)', '', ''],
    ['robot', 'ben robot değilim', 'Giderek saçmalaşan doğrulama testleri.', 'var(--blue)', 'light', ''],
    ['hafta', 'hayatın haftaları', 'Hayatın, kare kare.', '#ffb4a2', '', ''],
  ]],
];
let k = 0;
const base = document.documentElement.classList.contains('dawn') ? .6 : 0;
document.getElementById('list').innerHTML = GROUPS.map(([title, games]) =>
  `<h3>${title}</h3><div class="list">${games.map(([slug, name, desc, c, cls, tag]) =>
    `<a class="game ${cls}" href="${slug}/" style="--c:${c};animation-delay:${base + k++ * .05}s">
      <div class="ico">${icon(slug)}</div><div><h2>${name}</h2><p>${desc}</p></div>${tag ? `<span class="pill">${tag}</span>` : ''}</a>`).join('')}</div>`).join('');
</script>
</body>
</html>
