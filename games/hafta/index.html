<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hayatın haftaları · fadimrak</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
<style>
  main { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; text-align: center; }
  #out { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
  input[type=date] { color-scheme: dark; }
  canvas { width: 100%; max-width: 560px; }
  .big { font-size: 1.1rem; line-height: 1.7; max-width: 520px; }
  .big b { font-weight: 400; font-size: 1.8rem; display: block; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; width: 100%; }
  .facts div { padding: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; text-align: left; font-size: .8rem; color: var(--muted); line-height: 1.5; opacity: 0; animation: in .5s forwards; }
  .facts b { display: block; color: var(--fg); font-size: 1.15rem; font-weight: 400; margin-bottom: .2rem; }
  .legend { color: var(--muted); font-size: .75rem; }
</style>
</head>
<body>
<header><a href="../">← oyunlar</a><h1>hayatın haftaları</h1><span></span></header>
<main>
  <p class="hint">Doğum tarihini gir, hayatını haftalarla gör. Tarih sadece senin tarayıcında kalır.</p>
  <form id="form"><input type="date" id="bd" required aria-label="doğum tarihi"><button class="primary">göster</button></form>
  <div id="out" hidden>
    <div class="big" id="big"></div>
    <canvas id="c"></canvas>
    <div class="legend">her kare bir hafta · her satır bir yıl · 90 yıl</div>
    <div class="facts" id="facts"></div>
  </div>
</main>
<script src="../common.js"></script>
<script>
const fmt = n => Math.round(n).toLocaleString('tr-TR');
const YEARS = 90, COLS = 52;

function show(bdStr) {
  const bd = new Date(bdStr + 'T00:00'), now = new Date();
  const days = (now - bd) / 864e5;
  if (!(days > 0) || days > 130 * 365) return toast('geçerli bir tarih gir');
  store.set('hafta-bd', bdStr);
  const weeks = Math.floor(days / 7), years = days / 365.25;
  const out = document.getElementById('out');
  out.hidden = false;

  const left = Math.max(0, YEARS * COLS - weeks);
  document.getElementById('big').innerHTML = `<b>${fmt(weeks)}</b>hafta yaşadın. 90 yaşına kadar ${fmt(left)} hafta daha var.`;

  // Izgara: canvas, yaşanan haftalar sırayla dolar
  const c = document.getElementById('c'), dpr = devicePixelRatio || 1;
  const W = Math.min(560, c.parentElement.clientWidth), cell = W / COLS, H = cell * YEARS;
  c.width = W * dpr; c.height = H * dpr; c.style.height = H + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  const box = (i, color) => { ctx.fillStyle = color; ctx.fillRect((i % COLS) * cell + .5, Math.floor(i / COLS) * cell + .5, cell - 1.5, cell - 1.5); };
  for (let i = 0; i < YEARS * COLS; i++) box(i, '#1c1c1c');
  let i = 0;
  (function step() {
    const end = Math.min(weeks, i + 60);
    for (; i < end; i++) box(i, '#e6e6e6');
    if (i < weeks) requestAnimationFrame(step);
    else if (i < YEARS * COLS) box(i, '#777');
  })();

  const next = new Date(now.getFullYear(), bd.getMonth(), bd.getDate());
  if (next < now) next.setFullYear(now.getFullYear() + 1);
  const toBday = Math.ceil((next - now) / 864e5);
  const facts = [
    [fmt(days), 'gün yaşadın'],
    [fmt(days * 24 * 60 * 72), 'kalp atışı (dakikada ~72)'],
    [fmt(days * 24 * 60 * 15), 'nefes (dakikada ~15)'],
    [fmt(days / 29.53), 'dolunay gördün'],
    [fmt(years / 3) + ' yıl', 'uyuyarak geçti (~1/3)'],
    [fmt(days * 2.57e6 / 1e6) + ' milyon km', 'Dünya ile Güneş etrafında yol aldın'],
    [fmt(years * 4), 'mevsim değişimi'],
    [toBday === 365 || toBday === 366 || toBday === 0 ? 'bugün!' : toBday + ' gün', 'sonraki doğum gününe'],
    [fmt(days * 24 * 60 * 60 / 1e6) + ' milyon', 'saniye'],
  ];
  document.getElementById('facts').innerHTML = facts.map(([b, t], k) => `<div style="animation-delay:${.3 + k * .08}s"><b>${b}</b>${t}</div>`).join('');
}

document.getElementById('form').onsubmit = e => { e.preventDefault(); show(document.getElementById('bd').value); };
const saved = store.get('hafta-bd', null);
if (saved) { document.getElementById('bd').value = saved; show(saved); }
</script>
</body>
</html>
