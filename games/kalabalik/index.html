<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>hangisi daha? · fadimrak</title>
<meta name="theme-color" content="#f6f0e4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  :root { --accent: var(--pink); }
  main { display: flex; flex-direction: column; align-items: center; gap: 1.1rem; }
  .q { font-family: var(--head); font-weight: 900; font-size: clamp(1.4rem, 5.5vw, 2rem); text-align: center; margin: .2rem 0 0; animation: in .4s; }
  .q small { display: block; font-family: 'Outfit'; font-weight: 600; font-size: .8rem; color: var(--muted); margin-top: .2rem; }
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: .9rem; align-items: center; width: 100%; }
  .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; min-height: 250px; padding: 1.4rem 1rem; background: var(--c); border: 2px solid var(--ink); border-radius: 20px; box-shadow: var(--shadow); text-align: center; cursor: pointer; font: inherit; color: var(--ink); transition: transform .15s, box-shadow .15s; animation: pop .35s; }
  .side:hover:not(:disabled) { transform: translate(-2px, -3px); box-shadow: 6px 7px 0 var(--ink); }
  .side:disabled { cursor: default; opacity: 1; }
  .side h2 { margin: 0; font-size: clamp(1.25rem, 4.5vw, 1.7rem); line-height: 1.1; }
  .side .badge { width: 84px; height: 60px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 10px; background: var(--card) center / cover no-repeat; font-family: var(--head); font-weight: 900; font-size: 1.6rem; }
  .side .val { font-family: var(--head); font-weight: 900; font-size: 1.35rem; min-height: 1.6em; }
  .side.ok { outline: 4px solid var(--green); outline-offset: 3px; }
  .side.bad { outline: 4px solid var(--red); outline-offset: 3px; }
  .vs { font-family: var(--head); font-weight: 900; font-size: 1.1rem; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--bg); }
  @media (max-width: 560px) { .duel { grid-template-columns: 1fr; } .vs { margin: -.4rem auto; z-index: 1; } .side { min-height: 150px; padding: 1rem; } }
  .cats { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; }
  .cats label { font-size: .8rem; font-weight: 700; padding: .3rem .7rem; border: 2px solid var(--ink); border-radius: 99px; background: var(--card); cursor: pointer; user-select: none; }
  .cats input { display: none; } .cats label:has(input:checked) { background: var(--ink); color: var(--bg); }
</style>
</head>
<body>
<header><a class="back" href="../">← oyunlar</a><h1>hangisi daha?</h1><span class="tag" id="tag">seri 0</span></header>
<main>
  <div class="stats"><div><b id="s">0</b>seri</div><div><b id="b">0</b>rekor</div></div>
  <div class="q" id="q"></div>
  <div class="duel" id="duel"></div>
  <div class="row" id="again" hidden><button class="primary" id="p">tekrar oyna</button><button id="sh">paylaş</button></div>
  <div class="cats" id="cats"></div>
  <p class="hint">İller: TÜİK 2025 nüfusu, yüzölçümü ve il merkezi rakımı (Wikipedia). Ülkeler: Dünya Bankası 2023 nüfusu.</p>
</main>
<script src="../common.js"></script>
<script>
(async () => {
  const D = await (await fetch('veri.json')).json();
  const fmt = n => n.toLocaleString('tr-TR');
  const CATS = [
    { id: 'ilpop', name: 'il nüfusu', q: 'Hangi il daha kalabalık?', list: D.il, key: 'pop', unit: ' kişi' },
    { id: 'ilarea', name: 'il yüzölçümü', q: 'Hangi il daha büyük?', sub: 'yüzölçümü', list: D.il, key: 'area', unit: ' km²' },
    { id: 'ilalt', name: 'il rakımı', q: 'Hangi il merkezi daha yüksekte?', sub: 'denizden yükseklik', list: D.il, key: 'alt', unit: ' m' },
    { id: 'ulpop', name: 'ülke nüfusu', q: 'Hangi ülke daha kalabalık?', list: D.ulke, key: 'pop', unit: ' kişi' },
    { id: 'ularea', name: 'ülke yüzölçümü', q: 'Hangi ülke daha büyük?', sub: 'yüzölçümü', list: D.ulke, key: 'area', unit: ' km²' },
  ];
  const COLORS = ['#ff9fc6', '#ffd23f', '#9fe3c9', '#b6c8ff', '#ffbf8a', '#d6b8ff'];
  let on = store.get('kalabalik-cats', CATS.map(c => c.id));
  let best = store.get('kalabalik-best', 0), streak = 0, busy = false, cat, a, b;
  document.getElementById('b').textContent = best;

  document.getElementById('cats').innerHTML = CATS.map(c => `<label><input type="checkbox" value="${c.id}" ${on.includes(c.id) ? 'checked' : ''}>${c.name}</label>`).join('');
  document.querySelectorAll('#cats input').forEach(i => i.onchange = () => {
    const next = [...document.querySelectorAll('#cats input:checked')].map(x => x.value);
    if (!next.length) { i.checked = true; return toast('en az bir kategori seç'); }
    on = next; store.set('kalabalik-cats', on); restart();
  });

  // Seri uzadıkça fark azalır: önce kolay, sonra zor çiftler
  function pick() {
    cat = CATS.filter(c => on.includes(c.id))[Math.floor(Math.random() * on.length)];
    const minRatio = Math.max(1.08, 3 - streak * .15);
    for (let t = 0; t < 500; t++) {
      a = cat.list[Math.floor(Math.random() * cat.list.length)];
      b = cat.list[Math.floor(Math.random() * cat.list.length)];
      const r = Math.max(a[cat.key], b[cat.key]) / Math.max(1, Math.min(a[cat.key], b[cat.key]));
      if (a !== b && r >= minRatio && (t > 300 || r < minRatio * 3)) return;
    }
  }

  const badge = x => x.k ? `<div class="badge" style="background-image:url('https://flagcdn.com/w160/${x.k}.png')"></div>` : `<div class="badge">${String(x.p).padStart(2, '0')}</div>`;
  function render() {
    const c1 = COLORS[Math.floor(Math.random() * COLORS.length)];
    let c2; do c2 = COLORS[Math.floor(Math.random() * COLORS.length)]; while (c2 === c1);
    document.getElementById('q').innerHTML = cat.q + (cat.sub ? `<small>${cat.sub}</small>` : '');
    document.getElementById('duel').innerHTML = `
      <button class="side" data-i="0" style="--c:${c1}">${badge(a)}<h2>${a.n}</h2><div class="val"></div></button>
      <div class="vs">vs</div>
      <button class="side" data-i="1" style="--c:${c2}">${badge(b)}<h2>${b.n}</h2><div class="val"></div></button>`;
    document.querySelectorAll('.side').forEach(s => s.onclick = () => answer(+s.dataset.i));
  }

  function answer(i) {
    if (busy) return;
    busy = true;
    const items = [a, b], winner = a[cat.key] >= b[cat.key] ? 0 : 1, ok = i === winner;
    const sides = document.querySelectorAll('.side');
    sides.forEach(s => s.disabled = true);
    const t0 = performance.now();
    (function count() {
      const f = Math.min(1, (performance.now() - t0) / 800), e = 1 - (1 - f) ** 3;
      sides.forEach((s, k) => s.querySelector('.val').textContent = fmt(Math.round(items[k][cat.key] * e)) + cat.unit);
      if (f < 1) return requestAnimationFrame(count);
      sides[i].classList.add(ok ? 'ok' : 'bad');
      if (!ok) sides[winner].classList.add('ok');
      if (ok) {
        streak++;
        if (streak > best) { best = streak; store.set('kalabalik-best', best); if (streak > 1 && streak % 10 === 0) confetti(); }
        update();
        setTimeout(() => { busy = false; pick(); render(); }, 1000);
      } else {
        toast(`seri bitti: ${streak}`, 2200);
        document.getElementById('again').hidden = false;
        const final = streak;
        document.getElementById('sh').onclick = () => share(`hangisi daha? ${final} doğru üst üste\nfadimrak.xyz/games/kalabalik`);
      }
    })();
  }
  const update = () => { document.getElementById('s').textContent = streak; document.getElementById('b').textContent = best; document.getElementById('tag').textContent = 'seri ' + streak; };
  function restart() { streak = 0; busy = false; update(); document.getElementById('again').hidden = true; pick(); render(); }
  document.getElementById('p').onclick = restart;
  restart();
})();
</script>
</body>
</html>
