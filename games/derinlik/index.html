<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>derinlik · fadimrak</title>
<meta name="theme-color" content="#8fdcff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  :root { --accent: var(--blue); }
  body { background: #8fdcff; transition: background-color .25s, color .25s; }
  .sky { background: linear-gradient(#ffe9b8, #bfeaff 70%, #8fdcff); padding-bottom: 2.5rem; position: relative; }
  .sky header { padding-top: 1.1rem; }
  .sun { position: absolute; right: 12%; top: 70px; width: 70px; height: 70px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); box-shadow: 0 0 0 10px rgba(255,210,63,.3); }
  .surface { text-align: center; padding: 1.5rem 16px 0; position: relative; }
  .surface h2 { margin: 0; font-size: clamp(2.4rem, 10vw, 4rem); }
  .surface p { font-weight: 600; margin: .4rem 0 0; }
  .boat { font-size: 3rem; display: inline-block; animation: rock 3s ease-in-out infinite; margin-top: 1rem; }
  @keyframes rock { 50% { transform: rotate(6deg) translateY(3px); } }
  .wave { height: 26px; background: radial-gradient(circle at 13px -6px, transparent 16px, #8fdcff 17px) 0 0 / 26px 26px repeat-x; margin-top: -26px; position: relative; }
  .down { display: inline-block; margin-top: .8rem; font-weight: 800; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }
  .meter { position: fixed; top: 50%; right: 16px; transform: translateY(-50%); text-align: right; z-index: 3; pointer-events: none; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: .6rem .8rem; box-shadow: 3px 3px 0 var(--ink); }
  .meter b { display: block; font-family: var(--head); font-weight: 900; font-size: clamp(1.3rem, 5vw, 2rem); }
  .meter span { color: var(--muted); font-size: .72rem; font-weight: 700; }
  .ocean { position: relative; max-width: 680px; margin: 0 auto; }
  .item { position: absolute; left: 16px; right: 150px; padding: .8rem 1rem; background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 rgba(0,0,0,.5); opacity: 0; transform: translateY(14px); transition: opacity .6s, transform .6s; display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; }
  .item.seen { opacity: 1; transform: none; }
  .item .e { grid-row: span 3; font-size: 2rem; line-height: 1; }
  .item small { font-weight: 800; color: var(--blue); }
  .item h3 { margin: 0; font-size: 1.1rem; }
  .item p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.45; }
  .zone { position: absolute; left: 0; right: 0; border-top: 2px dashed currentColor; padding: .5rem 16px 0; opacity: .75; font-family: var(--head); font-weight: 900; letter-spacing: .06em; font-size: .9rem; }
  .zone small { font-family: 'Outfit'; font-weight: 600; letter-spacing: 0; display: block; opacity: .8; }
  .bubble { position: absolute; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; animation: rise linear infinite; pointer-events: none; }
  @keyframes rise { from { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-260px); opacity: 0; } }
  .bottom { position: absolute; left: 0; right: 0; text-align: center; padding: 2rem 16px; }
  .bottom .panel { color: var(--ink); max-width: 460px; margin: 0 auto; }
  .bottom h2 { margin: 0 0 .4rem; }
  @media (max-width: 520px) { .item { right: 16px; } .meter { top: auto; bottom: 16px; transform: none; } }
</style>
</head>
<body>
<div class="sky">
  <header><a class="back" href="../">← oyunlar</a><span></span><span class="tag">10.935 m</span></header>
  <div class="sun"></div>
  <div class="surface"><h2>derinlik</h2><p>okyanusun en dibine kadar in</p><div class="boat">⛵</div><br><span class="down">aşağı kaydır ↓</span></div>
</div>
<div class="wave"></div>
<div class="meter"><b id="m">0 m</b><span id="z">yüzey</span></div>
<div class="ocean" id="ocean"></div>
<script src="../common.js"></script>
<script>
const PX = 3, BOTTOM = 10935, TOP = 80;
const ZONES = [[0, 'GÜNEŞ IŞIKLI BÖLGE', 'ışık var, hayat bol'], [200, 'ALACAKARANLIK BÖLGESİ', 'ışık azalıyor'], [1000, 'GECE YARISI BÖLGESİ', 'güneş ışığı buraya hiç ulaşmaz'], [4000, 'ABİSAL BÖLGE', 'dondurucu soğuk, ezici basınç'], [6000, 'HADAL BÖLGE', 'okyanus çukurları']];
const ITEMS = [
  [10, '🫧', 'Basınç ikiye katlandı', 'Her 10 metrede basınç 1 atmosfer artar. Kırmızı renk ilk birkaç metrede kaybolur.'],
  [40, '🤿', 'Rekreasyonel dalış sınırı', 'Eğlence amaçlı tüplü dalışta inilen en fazla derinlik. Başlangıç sertifikası ise 18 m\'ye kadar izin verir.'],
  [150, '🌊', 'Karadeniz\'in nefessiz suları', 'Karadeniz\'de yaklaşık 150–200 m\'den sonra su oksijensizdir; hayat neredeyse durur.'],
  [214, '🏊', 'Serbest dalış rekoru', 'Herbert Nitsch tek nefeste 214 m\'ye indi (2007).'],
  [332, '🤿', 'Tüplü dalış rekoru', 'Ahmed Gabr 2014\'te 332 m\'ye daldı.'],
  [443, '🏙️', 'Empire State Binası', 'Anteniyle birlikte binanın boyu burada biterdi.'],
  [560, '🐧', 'İmparator penguen', 'Kaydedilen en derin penguen dalışlarından biri.'],
  [600, '🦑', 'Dev mürekkep balığı', 'Genellikle 300–1000 m arasında yaşadığı düşünülür.'],
  [828, '🏗️', 'Burj Khalifa', 'Dünyanın en yüksek binasını ters çevirsen ucu buraya değerdi.'],
  [1280, '🐢', 'Deri sırtlı kaplumbağa', 'En derine dalan kaplumbağa türü.'],
  [1500, '🏮', 'Fener balığı', 'Kendi ışığıyla av çeken bu balık yaklaşık 1000–4000 m arasında yaşar.'],
  [2212, '🌊', 'Karadeniz\'in dibi', 'Karadeniz\'in en derin noktası.'],
  [2250, '🐋', 'Kaşalot (ispermeçet balinası)', 'Dev mürekkep balığı avlamak için bu derinliklere iner.'],
  [2992, '🐳', 'Cuvier gagalı balinası', 'En derine dalan memeli. Saatlerce nefes tutabilir.'],
  [3800, '🚢', 'Titanic', 'Titanic\'in enkazı bu derinlikte yatıyor.'],
  [4791, '⚓', 'Bismarck', 'Alman savaş gemisinin enkazı.'],
  [5267, '🌊', 'Akdeniz\'in dibi', 'Akdeniz\'in en derin noktası, Calypso Çukuru.'],
  [8336, '🐟', 'En derindeki balık', 'Bir salyangoz balığı 2022\'de 8336 m\'de görüntülendi.'],
  [8849, '🏔️', 'Everest', 'Dünyanın en yüksek dağı ters çevrilse zirvesi burada olurdu. Ve hâlâ dibe 2 km var.'],
  [10908, '🎥', 'James Cameron', '2012\'de tek kişilik denizaltıyla buraya kadar indi.'],
];
// Derinliğe göre su rengi
const STOPS = [[0, [143, 220, 255]], [200, [46, 127, 209]], [1000, [11, 42, 91]], [4000, [4, 17, 42]], [BOTTOM, [0, 2, 8]]];
function waterAt(d) {
  for (let i = 1; i < STOPS.length; i++) if (d <= STOPS[i][0]) {
    const [d0, c0] = STOPS[i - 1], [d1, c1] = STOPS[i], f = (d - d0) / (d1 - d0);
    return c0.map((v, k) => Math.round(v + (c1[k] - v) * f));
  }
  return STOPS.at(-1)[1];
}

const ocean = document.getElementById('ocean');
ocean.style.height = (BOTTOM * PX + TOP + 600) + 'px';
const y = d => TOP + d * PX;
ZONES.forEach(([d, n, s]) => ocean.insertAdjacentHTML('beforeend', `<div class="zone" style="top:${y(d)}px">${n}<small>${d.toLocaleString('tr-TR')} m · ${s}</small></div>`));
ITEMS.forEach(([d, e, t, p]) => ocean.insertAdjacentHTML('beforeend', `<div class="item" style="top:${y(d) + 46}px"><span class="e">${e}</span><small>${d.toLocaleString('tr-TR')} m</small><h3>${t}</h3><p>${p}</p></div>`));
ocean.insertAdjacentHTML('beforeend', `<div class="bottom" style="top:${y(BOTTOM)}px"><div class="panel"><h2>Challenger Çukuru · 10.935 m</h2><p class="hint">Okyanusun en dibi. Burada basınç yüzeyin 1000 katından fazla. Buraya kadar kaydırdın, tebrikler!</p><button class="primary" onclick="scrollTo({top:0,behavior:'smooth'})">yüzeye çık ↑</button></div></div>`);
// İlk 600 m'de kabarcıklar
for (let i = 0; i < 26; i++) {
  const s = 6 + Math.random() * 14;
  ocean.insertAdjacentHTML('beforeend', `<i class="bubble" style="width:${s}px;height:${s}px;left:${Math.random() * 100}%;top:${y(Math.random() * 600) + 200}px;animation-duration:${4 + Math.random() * 5}s;animation-delay:-${Math.random() * 6}s"></i>`);
}

// Üst üste binen kartları aşağı kaydır
let floor = 0;
document.querySelectorAll('.item').forEach(el => {
  const t = Math.max(parseFloat(el.style.top), floor);
  el.style.top = t + 'px';
  floor = t + el.offsetHeight + 16;
});

const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('seen')), { rootMargin: '0px 0px -12% 0px' });
document.querySelectorAll('.item').forEach(el => io.observe(el));

const m = document.getElementById('m'), z = document.getElementById('z');
function update() {
  const top = ocean.getBoundingClientRect().top + scrollY;
  const d = Math.max(0, Math.min(BOTTOM, (scrollY + innerHeight / 2 - top - TOP) / PX));
  m.textContent = Math.round(d).toLocaleString('tr-TR') + ' m';
  z.textContent = d < 1 ? 'yüzey' : [...ZONES].reverse().find(([zd]) => d >= zd)[1].toLocaleLowerCase('tr-TR');
  const [r, g, b] = waterAt(d);
  document.body.style.backgroundColor = `rgb(${r},${g},${b})`;
  document.body.style.color = d > 120 ? '#e8f4ff' : 'var(--ink)';
}
addEventListener('scroll', update, { passive: true });
update();
</script>
</body>
</html>
