<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>kasaba · fadimrak</title>
<meta name="description" content="Küçük bir kasabada dolaş, sokak kedilerini bul ve besle.">
<meta name="theme-color" content="#9fdcff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Gramatika'; font-weight: 900; font-display: swap; src: local('Gramatika Black'), local('Gramatika-Black'); }
  :root { --ink: #1c1a17; --card: #fffdf8; --muted: #6f685d; --accent: #ff9f1c; --head: 'Gramatika', 'Outfit', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; background: #9fdcff; font-family: 'Outfit', system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; display: block; }
  a { color: inherit; }
  button { font: inherit; font-weight: 800; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: .65rem 1.1rem; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button.primary { background: var(--accent); }
  .back { position: fixed; top: 14px; left: 16px; z-index: 6; padding: .45rem .8rem; border: 2px solid var(--ink); border-radius: 99px; background: var(--card); text-decoration: none; font-weight: 700; font-size: .85rem; box-shadow: 2px 2px 0 var(--ink); }
  .hud { position: fixed; top: 64px; left: 16px; z-index: 3; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .chip { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); padding: .35rem .7rem; font-weight: 700; font-size: .85rem; }
  .chip b { font-family: var(--head); font-weight: 900; font-size: 1.15rem; }
  .clock { position: fixed; top: 14px; right: 16px; z-index: 3; pointer-events: none; }
  .cross { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); z-index: 3; pointer-events: none; }
  .prompt { position: fixed; left: 50%; top: calc(50% + 40px); transform: translateX(-50%); z-index: 4; pointer-events: none; }
  .prompt span { display: inline-block; padding: .5rem .9rem; background: #ffd23f; border: 2px solid var(--ink); border-radius: 10px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
  .bubble { position: fixed; z-index: 2; transform: translate(-50%, -100%); background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: .1rem .5rem; font-weight: 800; font-size: .85rem; pointer-events: none; white-space: nowrap; }
  .toast { position: fixed; top: 64px; left: 50%; transform: translate(-50%, -10px); padding: .6rem 1rem; background: var(--ink); color: #fff; border-radius: 12px; font-weight: 700; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 7; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(159, 220, 255, .55); backdrop-filter: blur(3px); padding: 16px; }
  .panel { max-width: 400px; text-align: center; background: var(--card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); padding: 1.4rem; }
  .panel h1 { font-family: var(--head); font-weight: 900; margin: 0 0 .3rem; font-size: 2.4rem; }
  .panel p { color: var(--muted); line-height: 1.55; margin: .5rem 0; }
  kbd { font-family: inherit; font-weight: 800; border: 2px solid var(--ink); border-radius: 6px; padding: 0 .3rem; background: #fff; color: var(--ink); }
  .foot { font-size: .75rem; margin-top: 1rem !important; }
  /* dokunmatik kontroller */
  .touch { display: none; }
  @media (pointer: coarse) { .touch { display: block; } .cross { display: none; } }
  .stick { position: fixed; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(28,26,23,.5); background: rgba(255,255,255,.25); z-index: 3; pointer-events: none; transform: translate(-50%, -50%); }
  .stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); }
  .tbtn { position: fixed; right: 18px; z-index: 4; width: 76px; height: 76px; border-radius: 50%; padding: 0; font-size: .85rem; }
  .tbtn.run { bottom: 24px; } .tbtn.feed { bottom: 112px; background: #ffd23f; }
</style>
</head>
<body>
<a class="back" href="../">← oyunlar</a>
<div class="hud">
  <div class="chip">bu tur <b id="fed">0</b> / <span id="total">8</span></div>
  <div class="chip">toplam <b id="all">0</b> kedi</div>
  <div class="chip" id="radar">en yakın kedi: <span id="near">–</span></div>
</div>
<div class="chip clock" id="clock">gündüz</div>
<div class="cross"></div>
<div class="prompt" id="prompt" hidden><span>besle <kbd>E</kbd></span></div>
<div class="touch"><div class="stick" id="stick" hidden><i id="knob"></i></div><button class="tbtn run" id="tRun">koş</button><button class="tbtn feed" id="tFeed" hidden>besle</button></div>
<div class="overlay" id="menu"><div class="panel">
  <h1>kasaba</h1>
  <p>Kasabada aç sokak kedileri var. Onları bul ve besle. Hepsi doyunca yeni kediler gelir.</p>
  <p id="help"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> yürü, fareyle bak, <kbd>Shift</kbd> koş, <kbd>E</kbd> besle</p>
  <button class="primary" id="go">kasabaya gir</button>
  <p class="foot">fadimrak tarafından yapılmıştır · <a href="/telif/">telif hakları</a></p>
</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = id => document.getElementById(id);
const touch = matchMedia('(pointer: coarse)').matches;
if (touch) $('help').textContent = 'Sol tarafı sürükleyerek yürü, sağ tarafı sürükleyerek etrafına bak.';

// ——— küçük yardımcılar
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let toastTimer;
function toast(msg, ms = 1800) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.append(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
const rand = rng(1923), R = (a, b) => a + rand() * (b - a), pickR = a => a[Math.floor(rand() * a.length)];

// ——— sahne
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const sky = new THREE.Color('#9fdcff');
scene.background = sky;
scene.fog = new THREE.Fog(sky, 70, 240);
const camera = new THREE.PerspectiveCamera(72, 1, .1, 600);
camera.rotation.order = 'YXZ';
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight('#ffffff', '#7ca86a', 1.5);
const sun = new THREE.DirectionalLight('#fff1d6', 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 260 });
sun.shadow.bias = -.0006;
scene.add(hemi, sun, sun.target);

const BOX = new THREE.BoxGeometry(1, 1, 1), SPH = new THREE.IcosahedronGeometry(1, 1), CYL = new THREE.CylinderGeometry(1, 1, 1, 12);
const PYR = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4); PYR.rotateY(Math.PI / 4);
const CONE7 = new THREE.ConeGeometry(1, 1, 7), EAR = new THREE.ConeGeometry(.12, .25, 4);
const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
// hareketli nesneler için tek tek mesh
function mesh(geo, c, x, y, z, sx = 1, sy = 1, sz = 1, ry = 0, parent = scene) {
  const m = new THREE.Mesh(geo, typeof c === 'string' ? mat(c) : c);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// sabit süsler: aynı geometrideki her şey tek bir InstancedMesh'te toplanır
const batches = new Map(), col = new THREE.Color();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
function deco(geo, c, x, y, z, sx = 1, sy = 1, sz = 1, ry = 0, frame = null, rx = 0) {
  _m.compose(_p.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, 0)), _s.set(sx, sy, sz));
  if (frame) _m.premultiply(frame.matrixWorld);
  if (!batches.has(geo)) batches.set(geo, []);
  batches.get(geo).push([_m.clone(), c]);
}
function flush() {
  for (const [geo, list] of batches) {
    const m = new THREE.InstancedMesh(geo, mat('#ffffff'), list.length);
    list.forEach(([mm, c], k) => { m.setMatrixAt(k, mm); m.setColorAt(k, col.set(c)); });
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }
  batches.clear();
}
const frame = (x, z, ry, y = 0) => { const f = new THREE.Object3D(); f.position.set(x, y, z); f.rotation.y = ry; f.updateMatrixWorld(); return f; };

// ——— çarpışma
const rects = [], circles = [];
const addRect = (x, z, w, d) => rects.push([x - w / 2, x + w / 2, z - d / 2, z + d / 2]);
const PR = .5;
const blocked = (x, z) => Math.hypot(x, z) > 150 || rects.some(([x0, x1, z0, z1]) => x > x0 - PR && x < x1 + PR && z > z0 - PR && z < z1 + PR) || circles.some(([cx, cz, r]) => Math.hypot(x - cx, z - cz) < r + PR);

// ——— zemin ve yollar
const grass = mesh(new THREE.CircleGeometry(400, 48), '#8fd16f', 0, 0, 0); grass.rotation.x = -Math.PI / 2; grass.castShadow = false;
const LOT = 30, STEP = 40, N = 5, HALF = (N * STEP) / 2;
for (let k = 0; k <= N; k++) {
  const p = -HALF + k * STEP;
  deco(BOX, '#ead7a8', p, .03, 0, 10, .06, N * STEP + 10);
  deco(BOX, '#ead7a8', 0, .031, p, N * STEP + 10, .06, 10);
}
for (let k = 0; k < 600; k++) {
  const along = R(-HALF, HALF), line = -HALF + Math.floor(rand() * (N + 1)) * STEP + R(-4, 4);
  const [x, z] = rand() < .5 ? [along, line] : [line, along];
  deco(BOX, pickR(['#dcc590', '#f3e4bd', '#d9c08a']), x, .07, z, R(.6, 1.2), .03, R(.6, 1.2), rand() * 3);
}

function tree(x, z, s = 1) {
  deco(CYL, '#9b6b43', x, 1.2 * s, z, .3 * s, 2.4 * s, .3 * s);
  const c = pickR(['#3fae5a', '#5cbf4a', '#2e9b55', '#7bc950']);
  if (rand() < .35) deco(CONE7, c, x, 4 * s, z, 1.8 * s, 4 * s, 1.8 * s);
  else { deco(SPH, c, x, 3.4 * s, z, 1.9 * s, 1.7 * s, 1.9 * s); deco(SPH, c, x + .7 * s, 3 * s, z + .4 * s, 1.2 * s, 1.1 * s, 1.2 * s); }
  circles.push([x, z, .5 * s]);
}
const flowerColors = ['#ff5a7a', '#ffd23f', '#ff9f1c', '#b388ff', '#ffffff', '#4dd0e1'];
function flowers(x, z, n = 6) { for (let k = 0; k < n; k++) { const fx = x + R(-1.5, 1.5), fz = z + R(-1.5, 1.5); deco(CYL, '#4caf50', fx, .2, fz, .04, .4, .04); deco(SPH, pickR(flowerColors), fx, .42, fz, .2, .16, .2); } }
function fence(x0, z0, x1, z1, gap) {
  const len = Math.hypot(x1 - x0, z1 - z0), n = Math.round(len / 1.5), ang = Math.atan2(x1 - x0, z1 - z0);
  for (let k = 0; k <= n; k++) {
    const f = k / n; if (gap && Math.abs(f - .5) < gap) continue;
    deco(BOX, '#fffaf0', x0 + (x1 - x0) * f, .55, z0 + (z1 - z0) * f, .18, 1.1, .18);
  }
  const segs = gap ? [[0, .5 - gap], [.5 + gap, 1]] : [[0, 1]];
  segs.forEach(([a, b]) => {
    const mx = x0 + (x1 - x0) * (a + b) / 2, mz = z0 + (z1 - z0) * (a + b) / 2, l = len * (b - a);
    deco(BOX, '#fffaf0', mx, .8, mz, .1, .12, l, ang);
    deco(BOX, '#fffaf0', mx, .4, mz, .1, .12, l, ang);
    rects.push(Math.abs(Math.sin(ang)) > .5 ? [mx - l / 2, mx + l / 2, mz - .15, mz + .15] : [mx - .15, mx + .15, mz - l / 2, mz + l / 2]);
  });
}

const WALLS = ['#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#ffc6ff', '#ffadad', '#fff1e6', '#e2ece9', '#f1c0e8'];
const ROOFS = ['#e63946', '#d1495b', '#f4a261', '#2a9d8f', '#6d597a', '#457b9d', '#e76f51', '#b5651d'];
function house(x, z, w, d, face) {
  const h = R(4.5, 7), g = frame(x, z, face);
  deco(BOX, pickR(WALLS), 0, h / 2, 0, w, h, d, 0, g);
  deco(PYR, pickR(ROOFS), 0, h + 2, 0, w + 1.2, 4, d + 1.2, 0, g);
  deco(BOX, '#7a4b2a', 0, 1.15, d / 2 + .01, 1.4, 2.3, .1, 0, g);
  deco(SPH, '#ffd23f', .45, 1.15, d / 2 + .08, .08, .08, .08, 0, g);
  for (const sx of [-1, 1]) {
    deco(BOX, '#bfe9ff', sx * w * .3, h * .6, d / 2 + .01, 1.2, 1.2, .08, 0, g);
    deco(BOX, '#ffffff', sx * w * .3, h * .6 - .7, d / 2 + .1, 1.5, .15, .25, 0, g);
    deco(BOX, pickR(flowerColors), sx * w * .3, h * .6 - .55, d / 2 + .15, 1.3, .15, .15, 0, g);
    deco(BOX, '#bfe9ff', w / 2 + .01, h * .6, sx * d * .25, .08, 1.1, 1.1, 0, g);
    deco(BOX, '#bfe9ff', -w / 2 - .01, h * .6, sx * d * .25, .08, 1.1, 1.1, 0, g);
  }
  deco(BOX, '#8d6e63', w * .25, h + 2.6, -d * .15, .8, 2.4, .8, 0, g);
  deco(BOX, '#d7ccc8', 0, .12, d / 2 + .9, 1.8, .24, 1.6, 0, g);
  const rot = Math.abs(Math.sin(face)) > .5;
  addRect(x, z, rot ? d : w, rot ? w : d);
}

// ——— parseller
const lamps = [], clockHands = [], ducks = [];
const special = { '2,2': 'meydan', '4,0': 'kule', '0,4': 'gol', '1,3': 'park', '3,1': 'park' };
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  const cx = -HALF + STEP / 2 + i * STEP, cz = -HALF + STEP / 2 + j * STEP, type = special[i + ',' + j] || 'ev';
  if (type === 'meydan') {
    deco(BOX, '#f1e3c3', cx, .05, cz, LOT + 6, .1, LOT + 6);
    deco(CYL, '#cfd8dc', cx, .45, cz, 5, .9, 5); deco(CYL, '#4fc3f7', cx, .82, cz, 4.4, .1, 4.4);
    deco(CYL, '#cfd8dc', cx, 1.7, cz, .5, 2.6, .5); deco(CYL, '#cfd8dc', cx, 2.9, cz, 1.6, .3, 1.6); deco(SPH, '#4fc3f7', cx, 3.3, cz, .6, .6, .6);
    circles.push([cx, cz, 5]);
    for (const [bx, bz, r] of [[cx - 10, cz, Math.PI / 2], [cx + 10, cz, -Math.PI / 2], [cx, cz - 10, 0], [cx, cz + 10, Math.PI]]) {
      const g = frame(bx, bz, r);
      deco(BOX, '#a1673f', 0, .55, 0, 3, .15, .9, 0, g); deco(BOX, '#a1673f', 0, 1, -.4, 3, .6, .12, 0, g);
      deco(BOX, '#455a64', -1.3, .27, 0, .15, .55, .8, 0, g); deco(BOX, '#455a64', 1.3, .27, 0, .15, .55, .8, 0, g);
    }
    for (const [lx, lz] of [[-13, -13], [13, -13], [-13, 13], [13, 13]]) {
      deco(CYL, '#37474f', cx + lx, 2, cz + lz, .12, 4, .12);
      lamps.push(mesh(SPH, new THREE.MeshLambertMaterial({ color: '#fff3b0', emissive: '#ffcc33', emissiveIntensity: 0 }), cx + lx, 4.2, cz + lz, .45, .45, .45));
      flowers(cx + lx * .75, cz + lz * .45, 8);
      circles.push([cx + lx, cz + lz, .2]);
    }
  } else if (type === 'kule') {
    deco(BOX, '#f1e3c3', cx, .05, cz, LOT, .1, LOT);
    deco(BOX, '#e9c46a', cx, 7, cz, 6, 14, 6); deco(PYR, '#e63946', cx, 16, cz, 8, 4, 8);
    for (const r of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) {
      deco(CYL, '#ffffff', 0, 0, 3.02, 1.6, .1, 1.6, 0, frame(cx, cz, r, 11), Math.PI / 2);
      const piv = new THREE.Group(); piv.position.set(cx + Math.sin(r) * 3.12, 11, cz + Math.cos(r) * 3.12); piv.rotation.y = r; scene.add(piv);
      const big = new THREE.Group(); piv.add(big); mesh(BOX, '#263238', 0, .5, 0, .12, 1.1, .05, 0, big);
      const small = new THREE.Group(); piv.add(small); mesh(BOX, '#263238', 0, .3, 0, .18, .7, .05, 0, small);
      clockHands.push([big, small]);
    }
    addRect(cx, cz, 6, 6);
    tree(cx - 10, cz + 10); tree(cx + 10, cz + 10); flowers(cx, cz + 8, 10);
  } else if (type === 'gol') {
    deco(CYL, '#4fc3f7', cx, .06, cz, 12, .1, 9);
    deco(CYL, '#d9c08a', cx, .03, cz, 13, .06, 10);
    circles.push([cx - 3, cz, 9], [cx + 3, cz, 9]);
    for (let k = 0; k < 3; k++) { const d = new THREE.Group(); d.position.set(cx + R(-6, 6), .2, cz + R(-4, 4)); scene.add(d); mesh(SPH, '#ffffff', 0, .3, 0, .5, .4, .7, 0, d); mesh(SPH, '#ffffff', 0, .75, .4, .28, .28, .28, 0, d); mesh(BOX, '#ff9f1c', 0, .72, .72, .15, .1, .25, 0, d); ducks.push(d); }
    for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; tree(cx + Math.cos(a) * 15, cz + Math.sin(a) * 13, .8); }
  } else if (type === 'park') {
    for (let k = 0; k < 7; k++) tree(cx + R(-12, 12), cz + R(-12, 12), R(.8, 1.2));
    flowers(cx, cz, 14); flowers(cx + 6, cz - 7, 8);
  } else {
    const face = j === 0 ? Math.PI : j === N - 1 ? 0 : (i + j) % 2 ? 0 : Math.PI;
    const front = Math.cos(face);
    if (rand() < .5) house(cx, cz - front * 3, R(9, 12), R(8, 10), face);
    else { house(cx - 7.5, cz - front * 3, R(7, 9), R(7, 9), face); house(cx + 7.5, cz - front * 3, R(7, 9), R(7, 9), face); }
    const e = LOT / 2;
    fence(cx - e, cz + front * e, cx + e, cz + front * e, .12);
    fence(cx - e, cz - e, cx - e, cz + e); fence(cx + e, cz - e, cx + e, cz + e);
    tree(cx - e + 2.5, cz - front * (e - 2.5), R(.8, 1.1)); tree(cx + e - 2.5, cz - front * (e - 2.5), R(.8, 1.1));
    flowers(cx - 9, cz + front * (e - 3), 6); flowers(cx + 9, cz + front * (e - 3), 6);
  }
}
for (let k = 0; k < 140; k++) { const a = rand() * Math.PI * 2, d = R(118, 160); tree(Math.cos(a) * d, Math.sin(a) * d, R(1, 1.8)); }
for (let k = 0; k < 14; k++) { const a = k / 14 * Math.PI * 2, d = R(190, 230); deco(SPH, pickR(['#7cc56a', '#8fd16f', '#6bb85a']), Math.cos(a) * d, -10, Math.sin(a) * d, R(30, 50), R(25, 40), R(30, 50)); }
flush();

// ——— kasabalılar
function person(shirt, pants, skin, hair) {
  const g = new THREE.Group(), legs = [], arms = [];
  mesh(BOX, shirt, 0, 1.55, 0, .9, 1, .5, 0, g);
  mesh(SPH, skin, 0, 2.4, 0, .42, .45, .42, 0, g);
  mesh(SPH, hair, 0, 2.62, -.05, .44, .3, .44, 0, g);
  mesh(BOX, '#263238', -.15, 2.45, .38, .07, .09, .04, 0, g); mesh(BOX, '#263238', .15, 2.45, .38, .07, .09, .04, 0, g);
  for (const s of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(s * .22, 1.05, 0); g.add(leg); mesh(BOX, pants, 0, -.5, 0, .32, 1, .36, 0, leg); mesh(BOX, '#3e2723', 0, -1, .08, .34, .18, .5, 0, leg); legs.push(leg);
    const arm = new THREE.Group(); arm.position.set(s * .6, 2, 0); g.add(arm); mesh(BOX, shirt, 0, -.4, 0, .25, .8, .28, 0, arm); mesh(SPH, skin, 0, -.85, 0, .14, .14, .14, 0, arm); arms.push(arm);
  }
  g.userData = { legs, arms, phase: 0 };
  scene.add(g);
  return g;
}
const villagers = [];
for (let k = 0; k < 7; k++) {
  const p = person(pickR(['#4dabf7', '#ff6b6b', '#51cf66', '#cc5de8', '#fcc419', '#20c997']), pickR(['#343a40', '#5c3d2e', '#1864ab']), pickR(['#f1c27d', '#e0ac69', '#c68642', '#ffdbac']), pickR(['#3e2723', '#212121', '#8d6e63', '#ffca28']));
  p.userData.walk = { line: -HALF + Math.floor(rand() * (N + 1)) * STEP, alongX: rand() < .5, pos: R(-HALF, HALF), dir: rand() < .5 ? 1 : -1, speed: R(2, 3.2) };
  villagers.push(p);
}

// ——— kediler
const CAT_COLORS = [['#ff9f43', '#ffbe76'], ['#2d3436', '#636e72'], ['#f5f6fa', '#dcdde1'], ['#95a5a6', '#b2bec3'], ['#f8e1b4', '#ffeaa7'], ['#a0522d', '#cd853f']];
function makeCat() {
  const [c1, c2] = CAT_COLORS[Math.floor(Math.random() * CAT_COLORS.length)], g = new THREE.Group();
  mesh(BOX, c1, 0, .45, 0, .5, .45, .95, 0, g);
  const head = new THREE.Group(); head.position.set(0, .8, .5); g.add(head);
  mesh(BOX, c1, 0, 0, 0, .5, .42, .42, 0, head);
  mesh(EAR, c2, -.15, .3, 0, 1, 1, 1, 0, head); mesh(EAR, c2, .15, .3, 0, 1, 1, 1, 0, head);
  mesh(BOX, '#2ecc71', -.12, .05, .21, .08, .1, .03, 0, head); mesh(BOX, '#2ecc71', .12, .05, .21, .08, .1, .03, 0, head);
  mesh(BOX, '#ff7aa2', 0, -.06, .22, .07, .05, .03, 0, head);
  for (const [x, z] of [[-.17, .33], [.17, .33], [-.17, -.33], [.17, -.33]]) mesh(BOX, c2, x, .14, z, .13, .28, .13, 0, g);
  const tail = new THREE.Group(); tail.position.set(0, .6, -.45); g.add(tail);
  mesh(BOX, c1, 0, .35, -.05, .1, .7, .1, 0, tail); tail.rotation.x = -.5;
  g.scale.setScalar(1.3);
  g.userData = { head, tail, fed: false, t: Math.random() * 10, home: null, target: null };
  return g;
}
const lerpA = (a, b, t) => a + ((((b - a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - Math.PI) * t;
const cats = [], hearts = [];
let round = 1, fedRound = 0, total = store.get('kasaba-total', 0);
$('all').textContent = total;
const pos = new THREE.Vector3(0, 0, 21); // oyuncunun yerdeki konumu
function spawnCats() {
  cats.splice(0).forEach(c => scene.remove(c));
  fedRound = 0;
  while (cats.length < 8) {
    const x = (Math.random() - .5) * (N * STEP + 10), z = (Math.random() - .5) * (N * STEP + 10);
    if (blocked(x, z) || cats.some(c => Math.hypot(c.position.x - x, c.position.z - z) < 25) || Math.hypot(x - pos.x, z - pos.z) < 25) continue;
    const c = makeCat(); c.position.set(x, 0, z); c.rotation.y = Math.random() * 6.28; c.userData.home = new THREE.Vector3(x, 0, z);
    scene.add(c); cats.push(c);
  }
  $('fed').textContent = 0;
}
function burst(p) {
  for (let k = 0; k < 7; k++) {
    const h = mesh(SPH, '#ff5a7a', p.x, 1.2, p.z, .16, .16, .16); h.castShadow = false;
    h.userData = { v: new THREE.Vector3((Math.random() - .5) * 2, 2.5 + Math.random() * 2, (Math.random() - .5) * 2), life: 1.2 };
    hearts.push(h);
  }
}
function meow() {
  try {
    const ac = meow.ac || (meow.ac = new AudioContext()), o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'triangle'; o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(1100, t + .12); o.frequency.exponentialRampToValueAtTime(500, t + .45);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(g).connect(ac.destination); o.start(); o.stop(t + .55);
  } catch {}
}
let close = null;
function feed() {
  if (!close || close.userData.fed) return;
  const c = close;
  c.userData.fed = true; fedRound++; total++;
  store.set('kasaba-total', total);
  $('fed').textContent = fedRound; $('all').textContent = total;
  mesh(CYL, '#4dabf7', c.position.x + Math.sin(c.rotation.y) * 1.1, .1, c.position.z + Math.cos(c.rotation.y) * 1.1, .3, .15, .3);
  burst(c.position); meow();
  toast(['mırr...', 'teşekkürler', 'miyav!', 'karnı doydu'][total % 4]);
  if (fedRound === cats.length) setTimeout(() => { toast(`${round}. tur bitti, yeni kediler geldi`, 3000); round++; spawnCats(); }, 1200);
}

// ——— kontroller: klavye + fare (pointer lock), dokunmatikte sanal çubuk + sürükleyerek bakış
const keys = {}, move = { x: 0, y: 0 };
let yaw = 0, pitch = 0, started = false;
const keymap = { KeyW: 'f', ArrowUp: 'f', KeyS: 'b', ArrowDown: 'b', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r', ShiftLeft: 'run', ShiftRight: 'run' };
addEventListener('keydown', e => { if (keymap[e.code]) { keys[keymap[e.code]] = true; e.preventDefault(); } if (e.code === 'KeyE') feed(); });
addEventListener('keyup', e => { if (keymap[e.code]) keys[keymap[e.code]] = false; });
const lock = () => { if (!touch) try { renderer.domElement.requestPointerLock()?.catch?.(() => {}); } catch {} };
// fare kilitliyse serbest bakış, kilit yoksa sol tuşla sürükleyerek bakış
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement && !(e.buttons & 1 && started && $('menu').hidden)) return;
  yaw -= e.movementX * .0022; pitch = Math.max(-1.3, Math.min(1.3, pitch - e.movementY * .0022));
});
document.addEventListener('pointerlockchange', () => {
  if (started && !touch && document.pointerLockElement !== renderer.domElement) { $('menu').hidden = false; $('go').textContent = 'devam et'; }
});
$('go').onclick = () => {
  $('menu').hidden = true; lock();
  if (!started) { started = true; spawnCats(); meow(); }
};
renderer.domElement.addEventListener('click', () => { if (started && $('menu').hidden) lock(); });

let stickId = null, stick0 = null, lookId = null, look0 = null;
addEventListener('touchstart', e => {
  if (!started || e.target.closest('button, a')) return;
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * .45 && stickId === null) { stickId = t.identifier; stick0 = [t.clientX, t.clientY]; Object.assign($('stick').style, { left: t.clientX + 'px', top: t.clientY + 'px' }); $('stick').hidden = false; }
    else if (lookId === null) { lookId = t.identifier; look0 = [t.clientX, t.clientY]; }
  }
}, { passive: true });
addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === stickId) {
      let dx = (t.clientX - stick0[0]) / 50, dy = (t.clientY - stick0[1]) / 50; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
      move.x = dx; move.y = -dy; $('knob').style.transform = `translate(${dx * 32}px, ${dy * 32}px)`;
    } else if (t.identifier === lookId) {
      yaw -= (t.clientX - look0[0]) * .005; pitch = Math.max(-1.2, Math.min(1.2, pitch - (t.clientY - look0[1]) * .005)); look0 = [t.clientX, t.clientY];
    }
  }
}, { passive: true });
const endTouch = e => { for (const t of e.changedTouches) { if (t.identifier === stickId) { stickId = null; move.x = move.y = 0; $('stick').hidden = true; $('knob').style.transform = ''; } if (t.identifier === lookId) lookId = null; } };
addEventListener('touchend', endTouch); addEventListener('touchcancel', endTouch);
$('tRun').addEventListener('pointerdown', () => keys.run = true); $('tRun').addEventListener('pointerup', () => keys.run = false); $('tRun').addEventListener('pointerleave', () => keys.run = false);
$('tFeed').onclick = feed;

// ——— gün döngüsü (3 dakika)
const DAY = 180, C = { day: new THREE.Color('#9fdcff'), dusk: new THREE.Color('#ffb38a'), night: new THREE.Color('#22305e') };
function daylight(t) {
  if (t < .55) return { c: C.day, k: 1, label: 'gündüz' };
  if (t < .65) { const f = (t - .55) / .1; return { c: C.day.clone().lerp(C.dusk, f), k: 1 - f * .3, label: 'akşamüstü' }; }
  if (t < .7) { const f = (t - .65) / .05; return { c: C.dusk.clone().lerp(C.night, f), k: .7 - f * .45, label: 'akşam' }; }
  if (t < .9) return { c: C.night, k: .25, label: 'gece' };
  const f = (t - .9) / .1; return { c: C.night.clone().lerp(C.day, f), k: .25 + f * .75, label: 'şafak' };
}

const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.hidden = true; document.body.append(bubble);
const proj = new THREE.Vector3(), tmp = new THREE.Vector3();
const clock = new THREE.Clock(), t0 = performance.now();
let bob = 0;

function loop() {
  const dt = Math.min(clock.getDelta(), .05), now = performance.now() / 1000;
  // yürüyüş: kameranın baktığı yöne göre
  const fw = (keys.f ? 1 : 0) - (keys.b ? 1 : 0) + move.y, st = (keys.r ? 1 : 0) - (keys.l ? 1 : 0) + move.x;
  const len = Math.min(1, Math.hypot(fw, st)), moving = started && len > .05;
  if (moving) {
    const sp = (keys.run ? 9 : 5) * len, a = Math.atan2(st, fw);
    const dx = (-Math.sin(yaw) * Math.cos(a) + Math.cos(yaw) * Math.sin(a)) * sp * dt, dz = (-Math.cos(yaw) * Math.cos(a) - Math.sin(yaw) * Math.sin(a)) * sp * dt;
    if (!blocked(pos.x + dx, pos.z + dz)) { pos.x += dx; pos.z += dz; }
    else if (!blocked(pos.x + dx, pos.z)) pos.x += dx;
    else if (!blocked(pos.x, pos.z + dz)) pos.z += dz;
    bob += dt * (keys.run ? 13 : 9) * len;
  }
  camera.position.set(pos.x, 1.7 + (moving ? Math.sin(bob) * .06 : 0), pos.z);
  camera.rotation.set(pitch, yaw, 0);

  villagers.forEach(v => {
    const w = v.userData.walk, u = v.userData;
    w.pos += w.dir * w.speed * dt;
    if (Math.abs(w.pos) > HALF) w.dir *= -1;
    if (w.alongX) { v.position.set(w.pos, 0, w.line + 2.5 * w.dir); v.rotation.y = w.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
    else { v.position.set(w.line + 2.5 * w.dir, 0, w.pos); v.rotation.y = w.dir > 0 ? 0 : Math.PI; }
    u.phase += dt * 7; const s = Math.sin(u.phase) * .7;
    u.legs[0].rotation.x = s; u.legs[1].rotation.x = -s; u.arms[0].rotation.x = -s * .8; u.arms[1].rotation.x = s * .8;
  });

  // kediler
  close = null; let nearest = Infinity, talker = null;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  cats.forEach(c => {
    const u = c.userData; u.t += dt;
    u.tail.rotation.z = Math.sin(u.t * (u.fed ? 6 : 2.5)) * .5;
    u.head.rotation.y = Math.sin(u.t * .7) * .4;
    const dx = c.position.x - pos.x, dz = c.position.z - pos.z, d = Math.hypot(dx, dz);
    const toMe = Math.atan2(-dx, -dz);
    if (u.fed) { c.rotation.y = lerpA(c.rotation.y, toMe, .05); return; }
    if (!u.target || Math.hypot(u.target.x - c.position.x, u.target.z - c.position.z) < .3) u.target = u.home.clone().add(tmp.set((Math.random() - .5) * 8, 0, (Math.random() - .5) * 8));
    if (d > 4) {
      c.rotation.y = lerpA(c.rotation.y, Math.atan2(u.target.x - c.position.x, u.target.z - c.position.z), .05);
      const tx = c.position.x + Math.sin(c.rotation.y) * dt * 1.2, tz = c.position.z + Math.cos(c.rotation.y) * dt * 1.2;
      if (!blocked(tx, tz)) c.position.set(tx, 0, tz); else u.target = null;
    } else c.rotation.y = lerpA(c.rotation.y, toMe, .08);
    nearest = Math.min(nearest, d);
    const facing = (dx * fx + dz * fz) / (d || 1);
    if (d < 3.2 && (facing > .55 || d < 1.6)) close = c;
    if (d < 16 && (!talker || d < talker.d)) talker = { c, d };
  });
  $('prompt').hidden = !close || touch; $('tFeed').hidden = !close;
  $('near').textContent = !started ? '–' : nearest === Infinity ? 'hepsi doydu' : nearest < 10 ? 'çok yakın' : `${Math.round(nearest)} m`;
  $('radar').style.background = nearest < 10 ? '#ffb4a2' : nearest < 30 ? '#ffe8a3' : '';
  if (talker && started && Math.sin(now * 2 + talker.c.userData.t) > .3) {
    proj.copy(talker.c.position).setY(1.6).project(camera);
    bubble.hidden = proj.z > 1;
    bubble.style.left = (proj.x + 1) / 2 * innerWidth + 'px'; bubble.style.top = (1 - proj.y) / 2 * innerHeight + 'px';
    bubble.textContent = 'miyav';
  } else bubble.hidden = true;

  for (let k = hearts.length - 1; k >= 0; k--) {
    const h = hearts[k], u = h.userData; u.life -= dt; u.v.y -= 4 * dt;
    h.position.addScaledVector(u.v, dt); h.scale.setScalar(.16 * Math.max(0, u.life));
    if (u.life <= 0) { scene.remove(h); hearts.splice(k, 1); }
  }
  ducks.forEach((d, k) => { d.position.x += Math.sin(now * .4 + k * 2) * dt * .8; d.position.z += Math.cos(now * .3 + k) * dt * .6; d.rotation.y = now * .3 + k * 2; d.position.y = .2 + Math.sin(now * 2 + k) * .05; });
  const t = ((performance.now() - t0) / 1000 / DAY + .15) % 1;
  clockHands.forEach(([big, small]) => { big.rotation.z = -t * Math.PI * 48; small.rotation.z = -t * Math.PI * 4; });

  const L = daylight(t);
  sky.copy(L.c); scene.fog.color.copy(L.c);
  hemi.intensity = .35 + 1.2 * L.k; sun.intensity = .15 + 2.2 * L.k;
  lamps.forEach(l => l.material.emissiveIntensity = L.k < .6 ? 2 : 0);
  $('clock').textContent = L.label;
  sun.position.set(pos.x + 50, 90, pos.z + 30);
  sun.target.position.copy(pos);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
