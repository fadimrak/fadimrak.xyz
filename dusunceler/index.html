<!doctype html>
<html lang="tr" data-native="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fadimrak</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; min-height: 100%; }
  body { background: #0a0a0a; color: #e6e6e6; font-family: ui-monospace, Menlo, Consolas, monospace; line-height: 1.7; }
  main { max-width: 680px; margin: 0 auto; padding: 4rem 1.25rem 3rem; animation: in 1.2s ease both; }
  .back { color: #555; text-decoration: none; font-size: .8rem; transition: color .3s; }
  .back:hover, .back:focus-visible { color: #e6e6e6; }
  h1 { margin: 1.5rem 0 2.5rem; font-size: 1.6rem; font-weight: 400; letter-spacing: .08em; }
  #yazilar { color: #999; } #yazilar h1 { color: #e6e6e6; }
  form { display: flex; gap: .5rem; }
  input, form button { font: inherit; color: #e6e6e6; background: #111; border: 1px solid #333; border-radius: 8px; padding: .55rem .8rem; }
  input { flex: 1; min-width: 0; letter-spacing: .2em; }
  input:focus-visible, form button:focus-visible { outline: 1px solid #777; outline-offset: 2px; }
  form button { cursor: pointer; color: #bbb; } form button:hover { border-color: #666; }
  #kapi { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; padding: 0 1.25rem; box-sizing: border-box; animation: in 1.2s ease both; }
  #kapi form { width: min(320px, calc(100vw - 2.5rem)); }
  #hata { text-align: center; min-height: 1.4em; margin: .6rem 0 0; color: #a55; font-size: .8rem; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="kapi">
<form id="kilit">
<input id="parola" type="password" inputmode="numeric" autocomplete="off" aria-label="şifre" placeholder="şifre" autofocus>
<button>aç</button>
</form>
<p id="hata" role="alert"></p>
</div>
<main hidden>
<a class="back" href="/">← geri</a>
<div id="yazilar"></div>
</main>
<script src="argon2.min.js"></script>
<script>
// Yazılar dusunceler/yazilar.json içinde AES-256-GCM ile şifreli; anahtar paroladan Argon2id ile türetilir (hash-wasm, MIT).
// Parola sayfada yok: yanlış parolada şifre çözme başarısız olur. Yeniden şifrelemek için: node scripts/dusunceler.mjs <parola>
const $ = id => document.getElementById(id), b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
$('kilit').addEventListener('submit', async e => {
  e.preventDefault();
  $('hata').textContent = 'açılıyor…';
  try {
    const d = await (await fetch('yazilar.json', { cache: 'no-store' })).json();
    const raw = await hashwasm.argon2id({ password: $('parola').value, salt: b(d.s), memorySize: d.m, iterations: d.t, parallelism: d.p, hashLength: 32, outputType: 'binary' });
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    $('yazilar').innerHTML = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(d.i) }, key, b(d.c)));
    $('kapi').remove(); document.title = ($('yazilar').querySelector('h1')?.textContent || 'fadimrak') + ' · fadimrak'; document.querySelector('main').hidden = false;
  } catch {
    $('hata').textContent = 'şifre yanlış';
    $('parola').select();
  }
});
</script>
</body>
</html>
